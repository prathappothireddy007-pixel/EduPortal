<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduPortal Academic & Campus Operations Platform</title>
  <!-- Tailwind CSS, Lucide Icons, Chart.js -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] },
          colors: {
            brand: {
              bg: '#06091a',
              surface: 'rgba(15, 23, 42, 0.75)',
              glass: 'rgba(255, 255, 255, 0.04)',
              border: 'rgba(255, 255, 255, 0.08)',
              blue: '#3B82F6',
              purple: '#8B5CF6',
              emerald: '#10B981',
              amber: '#F59E0B',
              rose: '#EF4444',
            }
          }
        }
      }
    }
  </script>

  <style>
    * { box-sizing: border-box; }
    body { background-color: #06091a; color: #F8FAFC; font-family: 'Inter', sans-serif; margin: 0; overflow-x: hidden; }
    
    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.6); }
    ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(59, 130, 246, 0.5); }

    /* Glassmorphism */
    .glass-panel {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.07);
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .glass-card:hover {
      background: rgba(255, 255, 255, 0.06);
      border-color: rgba(255, 255, 255, 0.15);
      transform: translateY(-2px);
    }

    .glass-input {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #F8FAFC;
      border-radius: 10px;
      padding: 10px 14px;
      outline: none;
      transition: all 0.2s;
    }
    .glass-input:focus {
      border-color: #3B82F6;
      background: rgba(59, 130, 246, 0.08);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
    }
    select.glass-input option { background: #0F172A; color: #F8FAFC; }

    /* Buttons */
    .btn-primary {
      background: linear-gradient(135deg, #3B82F6 0%, #6366F1 100%);
      color: #FFFFFF;
      font-weight: 600;
      border-radius: 10px;
      padding: 10px 20px;
      transition: all 0.2s;
      box-shadow: 0 4px 14px rgba(59, 130, 246, 0.3);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-primary:hover {
      opacity: 0.92;
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(59, 130, 246, 0.4);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.07);
      color: #94A3B8;
      border: 1px solid rgba(255, 255, 255, 0.1);
      font-weight: 500;
      border-radius: 10px;
      padding: 10px 20px;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.12);
      color: #F8FAFC;
    }

    .btn-danger {
      background: linear-gradient(135deg, #EF4444 0%, #DC2626 100%);
      color: #FFFFFF;
      font-weight: 600;
      border-radius: 10px;
      padding: 8px 16px;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn-success {
      background: linear-gradient(135deg, #10B981 0%, #059669 100%);
      color: #FFFFFF;
      font-weight: 600;
      border-radius: 10px;
      padding: 8px 16px;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    /* Metric Cards Accent Line */
    .stat-card { position: relative; overflow: hidden; }
    .stat-blue::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, #3B82F6, #6366F1); }
    .stat-emerald::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, #10B981, #059669); }
    .stat-amber::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, #F59E0B, #D97706); }
    .stat-purple::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, #8B5CF6, #7C3AED); }
    .stat-rose::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, #EF4444, #DC2626); }

    /* Animations */
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    .animate-fade-in { animation: fadeIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

    /* Badges */
    .badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 9999px; font-size: 12px; font-weight: 600; }
    .badge-blue { background: rgba(59, 130, 246, 0.15); color: #60A5FA; border: 1px solid rgba(59, 130, 246, 0.3); }
    .badge-emerald { background: rgba(16, 185, 129, 0.15); color: #34D399; border: 1px solid rgba(16, 185, 129, 0.3); }
    .badge-amber { background: rgba(245, 158, 11, 0.15); color: #FCD34D; border: 1px solid rgba(245, 158, 11, 0.3); }
    .badge-rose { background: rgba(239, 68, 68, 0.15); color: #FCA5A5; border: 1px solid rgba(239, 68, 68, 0.3); }
    .badge-purple { background: rgba(139, 92, 246, 0.15); color: #C4B5FD; border: 1px solid rgba(139, 92, 246, 0.3); }

    /* Toast */
    #toast-container { position: fixed; bottom: 24px; right: 24px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; max-width: 380px; }
    .toast-item { background: #0F172A; border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 12px; padding: 14px 18px; font-size: 14px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); display: flex; align-items: center; gap: 12px; animation: fadeIn 0.3s ease; }

    /* Stepper */
    .step-item { display: flex; flex-direction: column; align-items: center; position: relative; z-index: 1; flex: 1; }
    .step-circle { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; }
    .step-circle.active { background: #3B82F6; color: white; box-shadow: 0 0 15px rgba(59,130,246,0.6); }
    .step-circle.done { background: #10B981; color: white; }
    .step-circle.pending { background: rgba(255,255,255,0.08); color: #64748B; border: 1px solid rgba(255,255,255,0.1); }
  </style>
</head>
<body class="min-h-screen flex flex-col antialiased selection:bg-blue-500 selection:text-white">

  <!-- LANDING & AUTH CONTAINER (FEATURING KAGE 3D TEMPLE EXPERIENCE) -->
  <div id="auth-screen" class="fixed inset-0 z-50 overflow-hidden bg-[#030609]">
    <!-- Kage 3D Landing Page Running Live in Background -->
    <iframe id="kage-landing-iframe" src="/landing-pages/kage.html" class="absolute inset-0 w-full h-full border-0 z-0"></iframe>

    <!-- Top Floating Header over Kage -->
    <header class="absolute top-0 left-0 right-0 z-20 flex items-center justify-between px-6 py-4 pointer-events-auto">
      <div class="flex items-center gap-3 backdrop-blur-md bg-black/40 border border-white/10 px-4 py-2 rounded-full shadow-lg">
        <div class="w-7 h-7 rounded-full bg-gradient-to-tr from-[#e0231c] to-[#ff5a3c] flex items-center justify-center text-white shadow-md">
          <i data-lucide="graduation-cap" class="w-4 h-4 text-white"></i>
        </div>
        <span class="font-extrabold text-sm text-white tracking-tight">EduPortal <span class="text-[#ff5a3c] font-normal text-xs ml-1">× Kage 3D</span></span>
      </div>

      <div class="flex items-center gap-3">
        <button id="btn-toggle-explore" onclick="toggleAuthModal()" class="backdrop-blur-md bg-black/50 border border-white/15 hover:border-white/30 text-white text-xs font-semibold px-4 py-2.5 rounded-full transition-all shadow-lg flex items-center gap-2">
          <i data-lucide="compass" class="w-3.5 h-3.5 text-[#ff5a3c]"></i>
          <span id="explore-btn-text">Explore 3D Sanctuary</span>
        </button>

        <button onclick="showAuthModal()" class="btn-primary text-xs py-2.5 px-5 rounded-full shadow-xl bg-gradient-to-r from-[#e0231c] to-indigo-600 hover:opacity-95 flex items-center gap-2 border border-white/10">
          <i data-lucide="log-in" class="w-3.5 h-3.5"></i>
          <span>Sign In to Portal</span>
        </button>
      </div>
    </header>

    <!-- Floating Auth Card Modal -->
    <div id="auth-modal-wrapper" class="absolute inset-0 z-30 flex items-center justify-center p-4 bg-black/40 backdrop-blur-sm transition-all duration-300 pointer-events-auto">
      <div class="glass-panel w-full max-w-md p-8 rounded-3xl shadow-2xl relative border border-white/15 bg-slate-950/85 backdrop-blur-2xl">
        <!-- Close / Explore button on card -->
        <button onclick="toggleAuthModal()" title="Explore 3D Scene" class="absolute top-5 right-5 text-slate-400 hover:text-white p-1.5 rounded-full hover:bg-white/10 transition-all">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>

        <div class="text-center mb-6">
          <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-gradient-to-tr from-[#e0231c] to-indigo-600 mb-3 shadow-lg shadow-[#e0231c]/25">
            <i data-lucide="graduation-cap" class="w-8 h-8 text-white"></i>
          </div>
          <h1 class="text-2xl font-extrabold text-white tracking-tight">EduPortal OS</h1>
          <p class="text-xs text-slate-400 mt-1">Autonomous Academic & Campus Management System</p>
        </div>

        <!-- Role Selector -->
        <div class="grid grid-cols-3 gap-1.5 p-1 bg-white/5 rounded-xl mb-5 border border-white/10">
          <button id="btn-role-admin" onclick="setRole('admin')" class="py-2 rounded-lg text-xs font-bold transition-all text-slate-400 hover:text-white">Admin</button>
          <button id="btn-role-faculty" onclick="setRole('faculty')" class="py-2 rounded-lg text-xs font-bold transition-all bg-gradient-to-r from-blue-600 to-indigo-600 text-white shadow-md">Faculty</button>
          <button id="btn-role-student" onclick="setRole('student')" class="py-2 rounded-lg text-xs font-bold transition-all text-slate-400 hover:text-white">Student</button>
        </div>

        <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4">
          <div>
            <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1.5" id="login-id-label">Admin / Faculty ID</label>
            <input type="text" id="login-id" required class="glass-input w-full font-medium" placeholder="Enter User ID">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1.5">Password</label>
            <input type="password" id="login-password" required class="glass-input w-full font-medium" placeholder="••••••••">
          </div>
          <button type="submit" class="btn-primary w-full mt-2 py-3 flex items-center justify-center gap-2 bg-gradient-to-r from-[#e0231c] to-indigo-600">
            <span>Sign In to Portal</span>
            <i data-lucide="arrow-right" class="w-4 h-4"></i>
          </button>
        </form>

        <div class="mt-4 pt-3 border-t border-white/10 text-center">
          <button onclick="toggleAuthModal()" class="text-xs text-[#ff5a3c] hover:underline font-medium flex items-center justify-center gap-1.5 mx-auto">
            <i data-lucide="compass" class="w-3.5 h-3.5"></i>
            <span>Walk through Kyoto Mountain Temple 3D</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- MAIN APP WRAPPER (HIDDEN BEFORE LOGIN) -->
  <div id="app-screen" class="hidden flex min-h-screen">
    
    <!-- SIDEBAR -->
    <aside id="sidebar" class="w-64 glass-panel border-r border-white/10 flex flex-col justify-between transition-all duration-300 z-30 shrink-0">
      <div>
        <!-- Brand Header -->
        <div class="h-16 flex items-center justify-between px-6 border-b border-white/10">
          <div class="flex items-center gap-3">
            <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-600 flex items-center justify-center shadow-md">
              <i data-lucide="layers" class="w-5 h-5 text-white"></i>
            </div>
            <span class="font-extrabold text-lg text-white tracking-tight">EduPortal</span>
          </div>
          <button onclick="toggleSidebar()" class="text-slate-400 hover:text-white p-1 rounded-lg hover:bg-white/5">
            <i data-lucide="panel-left-close" class="w-5 h-5"></i>
          </button>
        </div>

        <!-- Navigation Links -->
        <div id="nav-container" class="px-3 py-4 space-y-6 overflow-y-auto max-h-[calc(100vh-8rem)]">
          <!-- Dynamic Nav loaded based on role -->
        </div>
      </div>

      <!-- User Footer -->
      <div class="p-4 border-t border-white/10 flex items-center justify-between glass-panel">
        <div class="flex items-center gap-3 overflow-hidden">
          <div id="user-avatar" class="w-9 h-9 rounded-full bg-blue-600/30 border border-blue-500/40 flex items-center justify-center font-bold text-blue-400 shrink-0">
            U
          </div>
          <div class="truncate">
            <p id="user-display-name" class="text-sm font-semibold text-white truncate">User</p>
            <p id="user-display-role" class="text-xs text-slate-400 capitalize">Role</p>
          </div>
        </div>
        <button onclick="handleLogout()" title="Logout" class="text-slate-400 hover:text-rose-400 p-2 rounded-lg hover:bg-white/5 transition-colors">
          <i data-lucide="log-out" class="w-5 h-5"></i>
        </button>
      </div>
    </aside>

    <!-- CONTENT WRAPPER -->
    <div class="flex-1 flex flex-col min-w-0 bg-[#06091a]">
      
      <!-- TOP HEADER BAR -->
      <header class="h-16 glass-panel border-b border-white/10 flex items-center justify-between px-8 sticky top-0 z-20">
        <div class="flex items-center gap-4">
          <h2 id="page-title" class="text-xl font-bold text-white tracking-tight">Dashboard Overview</h2>
        </div>

        <div class="flex items-center gap-4">
          <!-- 3D Kyoto Temple Quick Switcher -->
          <button onclick="switchTab('kage-experience')" class="btn-secondary text-xs py-1.5 px-3 flex items-center gap-1.5 border-[#e0231c]/30 text-slate-300 hover:text-white bg-white/5 hover:bg-white/10 transition-all shadow-sm">
            <span class="w-2 h-2 rounded-full bg-[#e0231c] animate-pulse"></span>
            <span>⛩️ 3D Kyoto Temple</span>
          </button>

          <!-- Notifications Bell Button -->
          <div class="relative">
            <button onclick="toggleNotificationPanel()" class="relative p-2 rounded-xl text-slate-400 hover:text-white hover:bg-white/5 transition-all">
              <i data-lucide="bell" class="w-5 h-5"></i>
              <span id="unread-count-badge" class="hidden absolute top-1.5 right-1.5 w-2.5 h-2.5 bg-rose-500 rounded-full ring-4 ring-[#06091a]"></span>
            </button>

            <!-- Notifications Dropdown Panel -->
            <div id="notification-dropdown" class="hidden absolute right-0 mt-3 w-80 sm:w-96 glass-panel rounded-2xl shadow-2xl border border-white/15 p-4 z-50 animate-fade-in">
              <div class="flex items-center justify-between pb-3 border-b border-white/10 mb-3">
                <h4 class="font-bold text-sm text-white">Notifications</h4>
                <button onclick="markAllNotificationsRead()" class="text-xs text-blue-400 hover:text-blue-300 font-medium">Mark all as read</button>
              </div>
              <div id="notification-list-container" class="space-y-2 max-h-80 overflow-y-auto pr-1 text-sm text-slate-300">
                <p class="text-xs text-slate-500 text-center py-4">No notifications yet.</p>
              </div>
            </div>
          </div>

          <div class="h-6 w-[1px] bg-white/10"></div>
          <span id="current-date" class="text-xs font-semibold text-slate-400 bg-white/5 px-3 py-1.5 rounded-lg border border-white/10"></span>
        </div>
      </header>

      <!-- MAIN DYNAMIC CONTENT CONTAINER -->
      <main id="main-content" class="flex-1 p-8 overflow-y-auto">
        <!-- Rendered dynamically -->
      </main>

    </div>
  </div>

  <!-- TOAST CONTAINER -->
  <div id="toast-container"></div>

  <!-- MODAL CONTAINER -->
  <div id="modal-wrapper" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70 backdrop-blur-sm animate-fade-in">
    <div class="glass-panel w-full max-w-lg rounded-2xl border border-white/15 shadow-2xl overflow-hidden">
      <div class="flex items-center justify-between px-6 py-4 border-b border-white/10">
        <h3 id="modal-title" class="font-bold text-lg text-white">Modal Header</h3>
        <button onclick="closeModal()" class="text-slate-400 hover:text-white p-1 rounded-lg hover:bg-white/5">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>
      <div id="modal-body" class="p-6 max-h-[75vh] overflow-y-auto space-y-4">
        <!-- Content -->
      </div>
      <div id="modal-footer" class="flex items-center justify-end gap-3 px-6 py-4 border-t border-white/10 bg-white/[0.02]">
        <!-- Action Buttons -->
      </div>
    </div>
  </div>

  <!-- JAVASCRIPT APPLICATION CORE -->
  <script>
    // App State Object
    const S = {
      role: 'faculty',
      token: localStorage.getItem('edu_token') || null,
      user: JSON.parse(localStorage.getItem('edu_user') || 'null'),
      tab: 'dashboard',
      cache: {},
      sidebarCollapsed: false,
      notifications: []
    };

    // --- UTILITIES & API HTTP WRAPPER ---
    async function api(method, path, body = null) {
      const headers = { 'Content-Type': 'application/json' };
      if (S.token) headers['Authorization'] = `Bearer ${S.token}`;
      
      const opts = { method, headers };
      if (body) opts.body = JSON.stringify(body);

      try {
        const res = await fetch(`/api${path}`, opts);
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Server error occurred');
        return data;
      } catch (err) {
        toast(err.message, 'error');
        throw err;
      }
    }

    function toast(msg, type = 'info') {
      const container = document.getElementById('toast-container');
      if (!container) return;
      const item = document.createElement('div');
      item.className = 'toast-item';
      
      let icon = 'info';
      let iconColor = 'text-blue-400';
      if (type === 'success') { icon = 'check-circle'; iconColor = 'text-emerald-400'; }
      if (type === 'error') { icon = 'alert-circle'; iconColor = 'text-rose-400'; }
      if (type === 'warning') { icon = 'alert-triangle'; iconColor = 'text-amber-400'; }

      item.innerHTML = `
        <i data-lucide="${icon}" class="w-5 h-5 ${iconColor} shrink-0"></i>
        <span class="text-sm font-medium text-slate-200">${msg}</span>
      `;
      container.appendChild(item);
      lucide.createIcons();

      setTimeout(() => {
        item.style.opacity = '0';
        item.style.transform = 'translateY(10px)';
        item.style.transition = 'all 0.3s';
        setTimeout(() => item.remove(), 300);
      }, 4000);
    }

    function setRole(role) {
      S.role = role;
      const bAdm = document.getElementById('btn-role-admin');
      const bFac = document.getElementById('btn-role-faculty');
      const bStu = document.getElementById('btn-role-student');
      const lbl = document.getElementById('login-id-label');
      const inp = document.getElementById('login-id');

      const activeClass = 'py-2 rounded-lg text-xs font-bold transition-all bg-blue-600 text-white shadow-md';
      const inactiveClass = 'py-2 rounded-lg text-xs font-bold transition-all text-slate-400 hover:text-white';

      if (bAdm) bAdm.className = role === 'admin' ? activeClass : inactiveClass;
      if (bFac) bFac.className = role === 'faculty' ? activeClass : inactiveClass;
      if (bStu) bStu.className = role === 'student' ? activeClass : inactiveClass;

      if (role === 'admin') {
        lbl.innerText = 'Institutional Admin ID or Email Address';
        inp.placeholder = 'e.g. 192411184 or admin@eduportal.com';
      } else if (role === 'faculty') {
        lbl.innerText = 'Faculty ID or Institutional Email';
        inp.placeholder = 'e.g. 2024FACCSE001';
      } else {
        lbl.innerText = 'Student Register Number (Reg No) or Email';
        inp.placeholder = 'e.g. 2024CSE001';
      }
    }

    async function handleLogin(e) {
      e.preventDefault();
      const adminId = document.getElementById('login-id').value.trim();
      const password = document.getElementById('login-password').value.trim();

      try {
        const data = await api('POST', '/auth/login', { adminId, password, role: S.role });
        S.token = data.token;
        S.user = data.user;
        localStorage.setItem('edu_token', data.token);
        localStorage.setItem('edu_user', JSON.stringify(data.user));

        toast('Welcome back, ' + S.user.name, 'success');
        initApp();
      } catch (err) {
        // Error already toasted by api wrapper
      }
    }

    function toggleAuthModal() {
      const modal = document.getElementById('auth-modal-wrapper');
      const btnText = document.getElementById('explore-btn-text');
      if (!modal) return;
      if (modal.classList.contains('hidden')) {
        modal.classList.remove('hidden');
        if (btnText) btnText.innerText = 'Explore 3D Sanctuary';
      } else {
        modal.classList.add('hidden');
        if (btnText) btnText.innerText = 'Open Portal Sign In';
      }
    }

    function showAuthModal() {
      const modal = document.getElementById('auth-modal-wrapper');
      const btnText = document.getElementById('explore-btn-text');
      if (!modal) return;
      modal.classList.remove('hidden');
      if (btnText) btnText.innerText = 'Explore 3D Sanctuary';
    }

    function handleLogout() {
      S.token = null;
      S.user = null;
      localStorage.removeItem('edu_token');
      localStorage.removeItem('edu_user');
      document.getElementById('app-screen').classList.add('hidden');
      document.getElementById('auth-screen').classList.remove('hidden');
      showAuthModal();
      toast('Signed out successfully', 'info');
    }

    // --- NAVIGATION DEFINITIONS FOR ADMIN, FACULTY, AND STUDENT ---

    async function fetchNotifications() {
      try {
        const notifs = await api('GET', '/notifications');
        S.notifications = notifs;
        const unread = notifs.filter(n => !n.is_read).length;
        const badge = document.getElementById('unread-count-badge');
        if (unread > 0) badge.classList.remove('hidden');
        else badge.classList.add('hidden');

        const list = document.getElementById('notification-list-container');
        if (notifs.length === 0) {
          list.innerHTML = `<p class="text-xs text-slate-500 text-center py-4">No notifications yet.</p>`;
          return;
        }

        list.innerHTML = notifs.map(n => `
          <div class="p-3 rounded-xl ${n.is_read ? 'bg-white/[0.02]' : 'bg-blue-500/10 border border-blue-500/20'} text-xs">
            <div class="flex items-center justify-between font-semibold text-white mb-1">
              <span>${n.title}</span>
              <span class="text-[10px] text-slate-500">${new Date(n.created_at).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</span>
            </div>
            <p class="text-slate-400 line-clamp-2">${n.message}</p>
          </div>
        `).join('');
      } catch(e) {}
    }

    function toggleNotificationPanel() {
      const panel = document.getElementById('notification-dropdown');

    async function saveAnnouncement() {
      const title = document.getElementById('m-ann-title')?.value.trim();
      const targetAudience = document.getElementById('m-ann-target')?.value || 'ALL';
      const priority = document.getElementById('m-ann-priority')?.value || 'info';
      const content = document.getElementById('m-ann-content')?.value.trim();
      const isPinned = document.getElementById('m-ann-pin')?.checked;
      const fileInput = document.getElementById('m-ann-pdf');

      if (!title) return toast('Announcement title is required', 'warning');
      if (!content) return toast('Announcement content is required', 'warning');

      let pdfB64 = null;
      let pdfName = null;

      if (fileInput && fileInput.files && fileInput.files[0]) {
        const file = fileInput.files[0];
        pdfName = file.name;
        pdfB64 = await new Promise((resolve) => {
          const reader = new FileReader();
          reader.onload = (e) => resolve(e.target.result);
          reader.readAsDataURL(file);
        });
      }

      try {
        await api('POST', '/announcements', { title, content, targetAudience, priority, isPinned, pdfB64, pdfName });
        toast('Announcement broadcasted to campus! 📢', 'success');
        closeModal();
        renderPage();
      } catch(e) {}
    }

    }

    let currentCourseFilter = 'ALL';

    function filterByCourse(course) {
      currentCourseFilter = course;
      document.querySelectorAll('.course-chip').forEach(btn => {
        if (btn.innerText.includes(course) || (course === 'ALL' && btn.innerText.includes('All'))) {
          btn.className = 'course-chip active py-1 px-3 rounded-lg bg-blue-600/30 text-blue-400 border border-blue-500/40 font-semibold transition-all';
        } else {
          btn.className = 'course-chip py-1 px-3 rounded-lg bg-white/5 text-slate-400 hover:text-white border border-white/10 font-medium transition-all';
        }
      });
      filterStudentTable();
    }

    function filterStudentTable() {
      const query = (document.getElementById('search-student')?.value || '').trim().toLowerCase();
      const clearBtn = document.getElementById('btn-clear-search');
      if (clearBtn) {
        if (query.length > 0) clearBtn.classList.remove('hidden');
        else clearBtn.classList.add('hidden');
      }

      const rows = document.querySelectorAll('#student-table-body tr');
      let visibleCount = 0;

      rows.forEach(row => {
        const reg = row.getAttribute('data-reg') || '';
        const name = row.getAttribute('data-name') || '';
        const cls = row.getAttribute('data-class') || '';
        const email = row.getAttribute('data-email') || '';

        const matchesQuery = !query || reg.includes(query) || name.includes(query) || cls.includes(query) || email.includes(query);
        const matchesCourse = currentCourseFilter === 'ALL' || reg.includes(currentCourseFilter.toLowerCase()) || cls.includes(currentCourseFilter.toLowerCase());

        if (matchesQuery && matchesCourse) {
          row.style.display = '';
          visibleCount++;
        } else {
          row.style.display = 'none';
        }
      });

      const badge = document.getElementById('student-count-badge');
      if (badge) {
        badge.innerText = `Showing ${visibleCount} of ${rows.length} Students`;
      }

      const noResult = document.getElementById('no-students-found');
      if (noResult) {

    async function autoGenerateRegNo() {
      const course = document.getElementById('m-s-course')?.value || 'CSE';
      const year = document.getElementById('m-s-year')?.value || new Date().getFullYear();
      const regInput = document.getElementById('m-s-id');
      const emailInput = document.getElementById('m-s-email');

      if (!regInput) return;

      try {
        const res = await api('GET', `/students/next-regno?course=${course}&year=${year}`);
        if (res && res.regNo) {
          regInput.value = res.regNo;
          if (emailInput && (!emailInput.value || emailInput.value.includes('@eduportal.com'))) {
            emailInput.value = `${res.regNo.toLowerCase()}@eduportal.com`;
          }
        }
      } catch (err) {
        // Fallback generator on client
        const fallback = `${year}${course}001`;
        regInput.value = fallback;
        if (emailInput && (!emailInput.value || emailInput.value.includes('@eduportal.com'))) {
          emailInput.value = `${fallback.toLowerCase()}@eduportal.com`;
        }
      }
    }

    async function savePhase1Grade() {
      const studentId = document.getElementById('p1-student')?.value;
      const subjectId = document.getElementById('p1-subject')?.value;
      const div1Assessments = document.getElementById('p1-d1')?.value;
      const div3ClassLab = document.getElementById('p1-d3')?.value;

      if (!studentId || !subjectId) return toast('Please select student and subject', 'warning');
      if (div1Assessments === '' || div3ClassLab === '') return toast('Please enter marks for both Assessment and Class Lab', 'warning');

      try {
        await api('POST', '/grades/submit-phase1', { studentId, subjectId, div1Assessments, div3ClassLab });
        toast('Phase 1 marks saved! "Close Course Launch" is now unlocked. 🚀', 'success');
        renderPage();
      } catch(e) {}
    }

    async function approveHallTicketRequest(requestId) {
      try {
        await api('PUT', `/grades/hall-ticket/approve/${requestId}`);
        toast('Hall ticket approved and issued to student! 🎟️', 'success');
        renderPage();
      } catch(e) {}
    }

    async function generatePPTReport(studentId) {
      toast('Generating PPT Presentation Report...', 'info');
      try {
        const res = await fetch(`/api/reports/generate-ppt/${studentId}`, {
          method: 'POST',
          headers: { 'Authorization': `Bearer ${S.token}` }
        });
        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          throw new Error(err.error || 'Failed to generate PPT');
        }
        const blob = await res.blob();
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `Student_Weekly_Report_${studentId}.pptx`;
        document.body.appendChild(a);
        a.click();
        window.URL.revokeObjectURL(url);
        a.remove();
        toast('PPT Report Generated & Downloaded!', 'success');
      } catch(e) {
        toast(e.message || 'PPT generation failed', 'error');
      }
    }

    async function saveDocumentToVault() {
      const title = document.getElementById('m-doc-title')?.value.trim();
      const category = document.getElementById('m-doc-cat')?.value;
      const fileInput = document.getElementById('m-doc-file');

      if (!title) return toast('Document title is required', 'warning');

      let fileB64 = '';
      let filename = 'document.pdf';

      if (fileInput && fileInput.files && fileInput.files[0]) {
        const file = fileInput.files[0];
        filename = file.name;
        fileB64 = await new Promise((resolve) => {
          const reader = new FileReader();
          reader.onload = (e) => resolve(e.target.result);
          reader.readAsDataURL(file);
        });
      }

      try {
        await api('POST', '/documents', { title, category, filename, fileB64 });
        toast('Document securely stored in Vault! 📄', 'success');
        closeModal();
        renderPage();
      } catch(e) {}
    }

                <span>Result Publication Date: ${new Date().toLocaleDateString()}</span>

              </div>
            </div>
          `}
        </div>
      `;
      lucide.createIcons();
    }

    async function renderStudentCertificates(container) {
      const certs = await api('GET', '/certificates');
      container.innerHTML = `
        <div class="space-y-6 animate-fade-in">
          <div class="flex items-center justify-between">
            <div>
              <h3 class="text-xl font-black text-white">My Earned Certificates</h3>
              <p class="text-xs text-slate-400">Verifiable credentials awarded by the institution.</p>
            </div>
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-3 gap-6">
            ${certs.length === 0 ? `
              <div class="col-span-full glass-panel p-12 text-center text-slate-400">
                <i data-lucide="medal" class="w-10 h-10 mx-auto mb-3 text-slate-500"></i>
                <h4 class="text-base font-bold text-white">No certificates issued yet</h4>
                <p class="text-xs text-slate-500 mt-1">Certificates issued by faculty will be displayed here.</p>
              </div>
            ` : certs.map(c => `
              <div class="glass-card p-6 rounded-2xl border border-white/10 space-y-3 flex flex-col justify-between">
                <div>
                  <span class="badge badge-emerald text-[10px] mb-2">Verified Certificate</span>
                  <h4 class="font-extrabold text-white text-base leading-snug">${c.display_event_title || c.event_name}</h4>
                  <p class="text-xs text-slate-400 mt-1">Issued: ${new Date(c.created_at).toLocaleDateString()}</p>
                  <p class="text-[11px] font-mono text-purple-400 mt-2">${c.cert_id}</p>
                </div>
                <button onclick="viewCertificateModal('${c.cert_id}', '${c.student_name}', '${c.display_event_title || c.event_name}', '${c.host_org || 'EduPortal Autonomous Institute'}')" class="btn-primary text-xs py-2 w-full flex items-center justify-center gap-2">
                  <i data-lucide="eye" class="w-3.5 h-3.5"></i>
                  <span>View Certificate</span>
                </button>
              </div>
            `).join('')}
          </div>
        </div>
      `;
      lucide.createIcons();
    }

    async function renderStudentAchievements(container) {
      const achs = await api('GET', '/achievements');
      container.innerHTML = `
        <div class="space-y-6 animate-fade-in">
          <div class="flex items-center justify-between">
            <div>
              <h3 class="text-xl font-black text-white">My Achievement Portfolio</h3>
              <p class="text-xs text-slate-400">Submit your hackathon awards, papers, and sports medals for faculty verification.</p>
            </div>
            <button onclick="openAddAchievementModal()" class="btn-primary flex items-center gap-2">
              <i data-lucide="plus-circle" class="w-4 h-4"></i>
              <span>Submit Achievement</span>
            </button>
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-3 gap-6">
            ${achs.length === 0 ? `
              <div class="col-span-full glass-panel p-12 text-center text-slate-400">
                <i data-lucide="trophy" class="w-10 h-10 mx-auto mb-3 text-slate-500"></i>
                <h4 class="text-base font-bold text-white">No achievements in portfolio yet</h4>
                <p class="text-xs text-slate-500 mt-1">Submit your awards and certificates above.</p>
              </div>
            ` : achs.map(a => `
              <div class="glass-card p-6 rounded-2xl border border-white/10 space-y-3">
                <div class="flex items-center justify-between">
                  <span class="badge badge-purple text-[10px]">${a.category}</span>
                  <span class="badge ${a.is_verified ? 'badge-emerald' : 'badge-amber'} text-[10px]">${a.is_verified ? 'Verified' : 'Pending'}</span>
                </div>
                <h4 class="font-bold text-white text-base">${a.title}</h4>
                <p class="text-xs text-slate-400">${a.org || 'Organization'}</p>
              </div>
            `).join('')}
          </div>
        </div>
      `;
      lucide.createIcons();
    }

    function openAddAchievementModal() {
      openModal('Submit Achievement to Portfolio', `
        <div class="space-y-4 text-left">
          <div><label class="block text-xs font-semibold text-slate-400 mb-1">Achievement Title</label><input type="text" id="m-ach-title" placeholder="e.g. 1st Place — National Hackathon 2026" class="glass-input w-full" required></div>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-semibold text-slate-400 mb-1">Category</label>
              <select id="m-ach-cat" class="glass-input w-full">
                <option value="Hackathon / Coding" selected>Hackathon / Coding</option>
                <option value="Research Paper">Research Paper / Journal</option>
                <option value="Technical Symposium">Technical Symposium</option>
                <option value="Sports & Athletics">Sports & Athletics</option>
                <option value="Project Expo">Project Expo</option>
              </select>
            </div>
            <div><label class="block text-xs font-semibold text-slate-400 mb-1">Host Organization</label><input type="text" id="m-ach-org" placeholder="e.g. IEEE / ACM" class="glass-input w-full"></div>
          </div>
        </div>
      `, `<button onclick="saveAchievement()" class="btn-primary w-full">Submit for Verification</button>`);
      lucide.createIcons();
    }

    async function saveAchievement() {
      const title = document.getElementById('m-ach-title')?.value.trim();
      const category = document.getElementById('m-ach-cat')?.value;
      const org = document.getElementById('m-ach-org')?.value.trim();
      if (!title) return toast('Achievement title required', 'warning');

      try {
        await api('POST', '/achievements', { title, category, org });
        toast('Achievement submitted for faculty verification! 🏆', 'success');
        closeModal();
        renderPage();
      } catch(e) {}
    }

    async function renderStudentDocuments(container) {
      const docs = await api('GET', '/documents');
      container.innerHTML = `
        <div class="space-y-6 animate-fade-in">
          <div class="flex items-center justify-between">
            <div>
              <h3 class="text-xl font-black text-white">My Digital Document Vault</h3>
              <p class="text-xs text-slate-400">Access your academic transcripts, ID proofs, and certificates.</p>
            </div>
            <button onclick="openUploadDocModal()" class="btn-primary flex items-center gap-2">
              <i data-lucide="upload" class="w-4 h-4"></i>
              <span>Upload Document</span>
            </button>
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-3 gap-6">
            ${docs.length === 0 ? `
              <div class="col-span-full glass-panel p-12 text-center text-slate-400">
                <i data-lucide="folder-open" class="w-10 h-10 mx-auto mb-3 text-slate-500"></i>
                <h4 class="text-base font-bold text-white">Your digital vault is empty</h4>
                <p class="text-xs text-slate-500 mt-1">Upload verified files to store them securely.</p>
              </div>
            ` : docs.map(d => `
              <div class="glass-card p-6 rounded-2xl border border-white/10 space-y-3 flex flex-col justify-between">
                <div>
                  <span class="badge badge-blue text-[10px] mb-2">${d.category || 'Document'}</span>
                  <h4 class="font-bold text-white text-base">${d.title}</h4>
                  <p class="text-xs text-slate-400 mt-1">${d.filename}</p>
                </div>
                ${d.file_b64 ? `
                  <a href="${d.file_b64}" download="${d.filename}" class="btn-primary text-xs py-2 px-3 flex items-center justify-center gap-2 text-center">
                    <i data-lucide="download" class="w-3.5 h-3.5"></i>
                    <span>Download File</span>
                  </a>
                ` : ''}
              </div>
            `).join('')}
          </div>
        </div>
      `;
      lucide.createIcons();
    }

    async function renderStudentIssues(container) {
      const issues = await api('GET', '/issues');
      container.innerHTML = `
        <div class="space-y-6 animate-fade-in">
          <div class="flex items-center justify-between">
            <div>
              <h3 class="text-xl font-black text-white">Student Support Helpdesk</h3>
              <p class="text-xs text-slate-400">Submit requests for academic queries, hostel, fee, or technical support.</p>
            </div>
            <button onclick="openCreateIssueModal()" class="btn-primary flex items-center gap-2">
              <i data-lucide="plus-circle" class="w-4 h-4"></i>
              <span>Create Support Ticket</span>
            </button>
          </div>
          <div class="glass-panel rounded-2xl border border-white/10 overflow-hidden">
            <table class="w-full text-left text-sm text-slate-300">
              <thead class="bg-white/5 text-xs text-slate-400 uppercase font-semibold border-b border-white/10">
                <tr>
                  <th class="p-4">Ticket Title</th>
                  <th class="p-4">Category</th>
                  <th class="p-4">Priority</th>
                  <th class="p-4">Status</th>
                  <th class="p-4">Created Date</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-white/5">
                ${issues.length === 0 ? `
                  <tr><td colspan="5" class="p-8 text-center text-slate-500">No support tickets filed. Click Create Support Ticket if you need assistance!</td></tr>
                ` : issues.map(i => `
                  <tr class="hover:bg-white/[0.02]">
                    <td class="p-4">
                      <div class="font-semibold text-white">${i.title}</div>
                      <div class="text-xs text-slate-400">${i.description || ''}</div>
                    </td>
                    <td class="p-4"><span class="badge badge-purple">${i.category}</span></td>
                    <td class="p-4"><span class="badge badge-amber">${i.priority}</span></td>
                    <td class="p-4"><span class="badge ${i.status === 'resolved' ? 'badge-emerald' : i.status === 'in_progress' ? 'badge-purple' : 'badge-blue'}">${i.status}</span></td>
                    <td class="p-4 text-xs text-slate-400">${new Date(i.created_at).toLocaleDateString()}</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;
      lucide.createIcons();
    }

    function openCreateIssueModal() {
      openModal('Create Student Support Ticket', `
        <div class="space-y-4 text-left">
          <div>
            <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1.5">Issue Title / Subject</label>
            <input type="text" id="m-iss-title" placeholder="e.g. Need clarification on Continuous Assessment 2 schedule" class="glass-input w-full font-medium" required>
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1.5">Category</label>
              <select id="m-iss-cat" class="glass-input w-full font-medium">
                <option value="Academic Support" selected>Academic Support</option>
                <option value="Examination & Marks">Examination & Marks</option>
                <option value="Hostel & Facilities">Hostel & Facilities</option>
                <option value="IT / Portal Support">IT / Portal Support</option>
                <option value="Accounts / Fee">Accounts / Fee</option>
                <option value="Other">Other</option>
              </select>
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1.5">Priority</label>
              <select id="m-iss-prio" class="glass-input w-full font-medium">
                <option value="medium" selected>Medium</option>
                <option value="high">High</option>
                <option value="urgent">Urgent</option>
                <option value="low">Low</option>
              </select>
            </div>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1.5">Detailed Description</label>
            <textarea id="m-iss-desc" rows="4" placeholder="Describe the issue or query in detail so staff can assist you promptly..." class="glass-input w-full text-sm font-normal" required></textarea>
          </div>
        </div>
      `, `
        <button onclick="saveIssue()" class="btn-primary w-full flex items-center justify-center gap-2">
          <i data-lucide="send" class="w-4 h-4"></i>
          <span>Submit Support Ticket</span>
        </button>
      `);
      lucide.createIcons();
    }

    async function saveIssue() {
      const title = document.getElementById('m-iss-title')?.value.trim();
      const category = document.getElementById('m-iss-cat')?.value;
      const priority = document.getElementById('m-iss-prio')?.value;
      const description = document.getElementById('m-iss-desc')?.value.trim();

      if (!title) return toast('Issue title is required', 'warning');
      if (!description) return toast('Description is required', 'warning');

      try {
        await api('POST', '/issues', { title, category, priority, description });
        toast('Support ticket submitted successfully! 🎟️', 'success');
        closeModal();
        renderPage();
      } catch(e) {}
    }

    // --- MODAL UTILITIES ---
    function openModal(title, bodyHtml, footerHtml = '') {
      document.getElementById('modal-title').innerText = title;
      document.getElementById('modal-body').innerHTML = bodyHtml;
      document.getElementById('modal-footer').innerHTML = footerHtml || `<button onclick="closeModal()" class="btn-secondary">Close</button>`;
      document.getElementById('modal-wrapper').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('modal-wrapper').classList.add('hidden');
    }

    function toggleSidebar() {
      const sb = document.getElementById('sidebar');
      sb.classList.toggle('w-64');
      sb.classList.toggle('w-20');
    }

    // Auto-init on load if token present
    window.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      if (S.token && S.user) initApp();
    });
  </script>
</body>
</html>
