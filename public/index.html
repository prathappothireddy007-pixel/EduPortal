<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>EduPortal | Management System</title>
<meta name="description" content="EduPortal – Smart school management with OD tracking, evaluation, and automated reports.">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700;9..40,800;9..40,900&display=swap" rel="stylesheet">
<script>tailwind.config={darkMode:'class',theme:{extend:{fontFamily:{sans:['DM Sans','sans-serif']}}}}</script>
<style>
*{scrollbar-width:thin;scrollbar-color:#f97316 #0f172a}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:#0f172a}
::-webkit-scrollbar-thumb{background:linear-gradient(#f97316,#ec4899);border-radius:10px}
body{font-family:'DM Sans',sans-serif;background:#06091a}

/* Background grid */
.bg-grid{background-image:linear-gradient(rgba(99,102,241,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(99,102,241,.06) 1px,transparent 1px);background-size:40px 40px}

/* Glass */
.glass{background:rgba(10,15,35,.75);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.glass-card{background:rgba(17,25,50,.7);backdrop-filter:blur(16px);border:1px solid rgba(99,130,255,.12)}
.glass-light{background:rgba(30,41,80,.5);border:1px solid rgba(99,130,255,.15)}

/* Gradient text */
.grad-fac{background:linear-gradient(135deg,#f97316,#ec4899);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.grad-stu{background:linear-gradient(135deg,#818cf8,#38bdf8);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}

/* Glow effects */
.glow-orange{box-shadow:0 0 24px rgba(249,115,22,.35),0 8px 32px rgba(0,0,0,.5)}
.glow-indigo{box-shadow:0 0 24px rgba(99,102,241,.35),0 8px 32px rgba(0,0,0,.5)}
.glow-emerald{box-shadow:0 0 24px rgba(16,185,129,.35),0 8px 32px rgba(0,0,0,.5)}
.glow-rose{box-shadow:0 0 24px rgba(239,68,68,.35),0 8px 32px rgba(0,0,0,.5)}

/* Buttons */
.btn-fac{background:linear-gradient(135deg,#f97316,#ec4899);transition:all .2s ease;color:#fff;font-weight:700}
.btn-fac:hover{box-shadow:0 0 28px rgba(249,115,22,.5);transform:translateY(-1px)}
.btn-stu{background:linear-gradient(135deg,#818cf8,#38bdf8);transition:all .2s ease;color:#fff;font-weight:700}
.btn-stu:hover{box-shadow:0 0 28px rgba(129,140,248,.5);transform:translateY(-1px)}
.btn-emerald{background:linear-gradient(135deg,#10b981,#059669);transition:all .2s ease;color:#fff;font-weight:700}
.btn-emerald:hover{box-shadow:0 0 24px rgba(16,185,129,.4);transform:translateY(-1px)}
.btn-rose{background:linear-gradient(135deg,#ef4444,#dc2626);transition:all .2s ease;color:#fff;font-weight:700}
.btn-rose:hover{box-shadow:0 0 24px rgba(239,68,68,.4);transform:translateY(-1px)}

/* Nav */
.nav-fac{background:linear-gradient(135deg,#f97316,#ec4899);color:#fff;box-shadow:0 4px 20px rgba(249,115,22,.4)}
.nav-stu{background:linear-gradient(135deg,#818cf8,#38bdf8);color:#fff;box-shadow:0 4px 20px rgba(129,140,248,.4)}

/* Input */
.inp{background:rgba(10,15,35,.8);border:1.5px solid rgba(99,130,255,.2);color:#e2e8f0;transition:all .2s}
.inp:focus{outline:none;border-color:#f97316;box-shadow:0 0 0 3px rgba(249,115,22,.15)}
.inp::placeholder{color:#475569}
.inp-stu:focus{border-color:#818cf8;box-shadow:0 0 0 3px rgba(129,140,248,.15)}
select option{background:#0f172a;color:#e2e8f0}

/* Cards */
.stat-card{transition:all .3s ease;position:relative;overflow:hidden}
.stat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--card-grad,linear-gradient(90deg,#f97316,#ec4899))}
.stat-card:hover{transform:translateY(-6px);box-shadow:0 20px 48px rgba(0,0,0,.6)}
.card-hover{transition:all .2s ease}
.card-hover:hover{border-color:rgba(249,115,22,.35);box-shadow:0 8px 32px rgba(0,0,0,.4)}

/* Login BG */
.login-bg{background:radial-gradient(ellipse at 15% 50%,rgba(249,115,22,.2) 0,transparent 55%),radial-gradient(ellipse at 85% 20%,rgba(236,72,153,.18) 0,transparent 55%),radial-gradient(ellipse at 55% 80%,rgba(99,102,241,.15) 0,transparent 55%),#06091a}

/* Animations */
@keyframes slideUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
@keyframes scaleIn{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
@keyframes pulse-glow{0%,100%{box-shadow:0 0 0 0 rgba(249,115,22,.6)}50%{box-shadow:0 0 0 16px rgba(249,115,22,0)}}
.anim-up{animation:slideUp .35s ease both}
.anim-scale{animation:scaleIn .25s ease both}
.float{animation:float 3s ease-in-out infinite}
.pulse-glow{animation:pulse-glow 2s ease-in-out infinite}
.skeleton{background:linear-gradient(90deg,#1e2d50 25%,#253562 50%,#1e2d50 75%);background-size:200% 100%;animation:shimmer 1.5s infinite}

/* Table */
.tbl-row:hover{background:rgba(99,130,255,.06)}
</style>
</head>
<body class="min-h-screen text-slate-200 bg-grid overflow-x-hidden" style="background-color:#06091a">

<!-- ═══ LOGIN ═══ -->
<div id="login-screen" class="fixed inset-0 z-50 login-bg flex items-center justify-center p-4">
  <!-- floating blobs -->
  <div class="absolute w-96 h-96 rounded-full top-10 -left-20 pointer-events-none" style="background:radial-gradient(circle,rgba(249,115,22,.12),transparent 70%)"></div>
  <div class="absolute w-80 h-80 rounded-full bottom-10 -right-10 pointer-events-none" style="background:radial-gradient(circle,rgba(99,102,241,.12),transparent 70%)"></div>

  <div class="w-full max-w-md z-10 anim-scale">
    <div class="text-center mb-8 float">
      <div class="w-20 h-20 mx-auto rounded-3xl btn-fac flex items-center justify-center text-white font-black text-4xl shadow-2xl mb-4 glow-orange">E</div>
      <h1 class="text-4xl font-black text-white tracking-tight">EduPortal</h1>
      <p class="text-slate-400 text-sm mt-1 font-medium">Intelligent School Management</p>
    </div>

    <div class="glass-card rounded-3xl p-8 shadow-2xl">
      <div class="flex p-1.5 rounded-2xl mb-7" style="background:rgba(10,15,35,.6)">
        <button onclick="setLoginTab('faculty')" id="ltab-faculty" class="flex-1 py-2.5 text-sm font-bold rounded-xl transition-all">🎓 Faculty</button>
        <button onclick="setLoginTab('student')" id="ltab-student" class="flex-1 py-2.5 text-sm font-bold rounded-xl transition-all text-slate-400">👤 Student</button>
      </div>

      <div id="form-faculty" class="space-y-4">
        <div class="relative"><span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-500"><i data-lucide="shield" class="w-4 h-4"></i></span>
          <input id="f-adminId" placeholder="Admin ID" class="inp w-full rounded-xl py-3 pl-11 pr-4 text-sm"></div>
        <div class="relative"><span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-500"><i data-lucide="lock" class="w-4 h-4"></i></span>
          <input id="f-pass" type="password" placeholder="Password" class="inp w-full rounded-xl py-3 pl-11 pr-4 text-sm" onkeydown="if(event.key==='Enter')doLogin()"></div>
        <button onclick="doLogin()" class="btn-fac w-full py-3.5 rounded-xl text-sm mt-2 glow-orange">Login as Administrator</button>
      </div>

      <div id="form-student" class="space-y-4 hidden">
        <div class="relative"><span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-500"><i data-lucide="mail" class="w-4 h-4"></i></span>
          <input id="s-email" type="email" placeholder="Student Email" class="inp inp-stu w-full rounded-xl py-3 pl-11 pr-4 text-sm"></div>
        <div class="relative"><span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-500"><i data-lucide="lock" class="w-4 h-4"></i></span>
          <input id="s-pass" type="password" placeholder="Password" class="inp inp-stu w-full rounded-xl py-3 pl-11 pr-4 text-sm" onkeydown="if(event.key==='Enter')doLogin()"></div>
        <button onclick="doLogin()" class="btn-stu w-full py-3.5 rounded-xl text-sm mt-2 glow-indigo">Login to Student Portal</button>
      </div>

      <p class="text-center text-xs text-slate-600 mt-5">Default student password: <code class="text-slate-400">welcome</code></p>
    </div>
  </div>
</div>

<!-- ═══ APP ═══ -->
<div id="app" class="hidden min-h-screen flex flex-col">

  <!-- Header -->
  <header class="sticky top-0 z-40 glass border-b border-white/5 shadow-2xl">
    <div class="max-w-screen-xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <div id="hdr-logo" class="w-10 h-10 rounded-xl btn-fac flex items-center justify-center font-black text-white text-lg glow-orange shrink-0">E</div>
        <div>
          <div id="hdr-title" class="font-black text-base grad-fac">EduPortal</div>
          <div id="hdr-sub" class="text-[10px] text-slate-500 uppercase tracking-widest font-bold">Management System</div>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <div class="hidden sm:flex items-center gap-2 px-3 py-1.5 rounded-lg glass-light">
          <i data-lucide="clock" class="w-3.5 h-3.5 text-slate-500"></i>
          <span id="hdr-clock" class="text-xs font-mono text-slate-400"></span>
        </div>
        <button onclick="doLogout()" id="hdr-avatar" title="Logout"

    </div>

  <div class="flex flex-1 max-w-screen-xl mx-auto w-full px-3 sm:px-6 py-5 gap-5">
    <!-- Sidebar -->

      <div class="sticky top-24">
        <p class="text-[9px] font-black text-slate-600 uppercase tracking-widest px-3 mb-3">Navigation</p>
        <nav id="sidebar" class="space-y-1"></nav>
      </div>
    </aside>

<!-- ═══ GEO-CAM MODAL ═══ -->
<div id="geo-modal" class="fixed inset-0 z-[70] hidden items-center justify-center p-4" style="background:rgba(0,0,0,.9);backdrop-filter:blur(12px)">
  <div class="glass-card rounded-3xl p-6 w-full max-w-md anim-scale shadow-2xl">
    <div class="flex items-center justify-between mb-4">
      <div><h3 class="font-black text-lg text-white">📍 Geo-Tag Camera</h3>
        <p class="text-xs text-slate-400 mt-0.5">Live photo with GPS stamp — no uploads allowed</p></div>
      <button onclick="closeGeoModal()" class="w-8 h-8 rounded-lg glass-light flex items-center justify-center text-slate-400 hover:text-rose-400 transition-colors">
        <i data-lucide="x" class="w-4 h-4"></i></button>
    </div>
    <div class="relative rounded-2xl overflow-hidden bg-slate-950 mb-4" style="aspect-ratio:4/3">
      <video id="geo-video" autoplay playsinline class="w-full h-full object-cover"></video>
      <canvas id="geo-canvas" class="hidden absolute inset-0 w-full h-full object-cover"></canvas>
      <div id="geo-overlay" class="absolute bottom-0 left-0 right-0 p-3" style="background:linear-gradient(transparent,rgba(0,0,0,.85))">
        <p id="geo-coords" class="text-[11px] font-mono text-emerald-400">📡 Acquiring GPS...</p>
        <p id="geo-time" class="text-[10px] font-mono text-slate-400"></p>

          <p class="text-sm text-slate-400">Starting camera...</p></div>
      </div>
    </div>
    <div id="geo-gps-status" class="mb-4 p-3 rounded-xl glass-light text-xs">
      <p class="text-emerald-400 font-bold flex items-center gap-1">
        <i data-lucide="map-pin" class="w-3.5 h-3.5"></i><span id="geo-status-text">Waiting for GPS...</span></p>
    </div>
    <div class="flex gap-3">
      <button onclick="captureGeoPhoto()" id="geo-capture-btn" class="btn-fac flex-1 py-3 rounded-xl text-sm flex items-center justify-center gap-2 disabled:opacity-40 disabled:cursor-not-allowed" disabled>
        <i data-lucide="camera" class="w-4 h-4"></i> Capture & Submit</button>
      <button onclick="closeGeoModal()" class="px-5 py-3 rounded-xl text-sm font-bold text-slate-400 glass-light hover:text-white transition-colors">Cancel</button>
    </div>

</div>

<!-- ═══ IMAGE VIEWER ═══ -->

  <img id="img-viewer-src" src="" class="max-w-full max-h-full rounded-2xl shadow-2xl">
</div>

<!-- ═══ MODAL ═══ -->
<div id="modal" class="fixed inset-0 z-[60] hidden items-center justify-center p-4" style="background:rgba(0,0,0,.8);backdrop-filter:blur(10px)">
  <div id="modal-inner" class="glass-card rounded-3xl p-6 w-full max-w-lg shadow-2xl max-h-[90vh] overflow-y-auto anim-scale">
    <div class="flex items-center justify-between mb-5">
      <h3 id="modal-title" class="font-black text-lg text-white"></h3>
      <button onclick="closeModal()" class="w-8 h-8 rounded-lg glass-light flex items-center justify-center text-slate-400 hover:text-rose-400 transition-colors">
        <i data-lucide="x" class="w-4 h-4"></i></button>
    </div>
    <div id="modal-body"></div>
    <div id="modal-footer" class="flex gap-3 justify-end mt-5"></div>
  </div>
</div>

<!-- Loading overlay -->
<div id="loading-overlay" class="fixed inset-0 z-[90] hidden items-center justify-center" style="background:rgba(0,0,0,.9);backdrop-filter:blur(16px)">
  <div class="text-center anim-scale">
    <div class="relative w-20 h-20 mx-auto mb-6">
      <div class="w-20 h-20 rounded-full border-4" style="border-color:rgba(99,102,241,.2)"></div>
      <div class="w-20 h-20 rounded-full border-4 border-orange-500 border-t-transparent animate-spin absolute inset-0"></div>
      <i data-lucide="file-bar-chart" class="w-8 h-8 text-orange-400 absolute inset-0 m-auto"></i>
    </div>
    <p id="loading-title" class="text-xl font-black text-white mb-1">Processing...</p>
    <p id="loading-desc" class="text-slate-400 text-sm">Please wait</p>
  </div>
</div>

<!-- Toast -->
<div id="toasts" class="fixed bottom-6 right-4 z-[100] flex flex-col gap-2 pointer-events-none"></div>

<script>
// ─────────────────────────────────────────
// STATE
// ─────────────────────────────────────────
const S = {
  user: JSON.parse(localStorage.getItem('ep_user')||'null'),
  token: localStorage.getItem('ep_token')||null,
  tab: 'dashboard',
  d: { students:[],classes:[],subjects:[],grades:[],attendance:[],events:[],odRequests:[],enrollmentRequests:[] },
  lastFetch: {},
  geoCamOdId: null, geoStream: null, geoLat: null, geoLng: null
};

// ─────────────────────────────────────────
// API
// ─────────────────────────────────────────
async function api(method, path, body, raw=false) {
  const opts = { method, headers:{'Content-Type':'application/json',...(S.token?{Authorization:'Bearer '+S.token}:{})} };
  if (body!==undefined) opts.body = JSON.stringify(body);
  const res = await fetch('/api'+path, opts);
  if (raw) return res;
  if (!res.ok) { const e=await res.json().catch(()=>({})); throw new Error(e.error||`HTTP ${res.status}`); }
  return res.json();
}

// Tab-specific data map — only load what each tab needs
const TAB_NEEDS = {
  dashboard:    ['students','classes','subjects','attendance','events','odRequests'],
  students:     ['students','classes'],
  curriculum:   ['classes','subjects'],
  gradebook:    ['students','classes','subjects','grades'],
  evaluation:   ['students','classes','subjects','grades'],
  attendance:   ['students','classes','attendance','odRequests'],
  events:       ['events'],
  reports:      ['students'],
  s_overview:   ['grades','attendance','odRequests'],
  s_enrollment: ['classes','enrollmentRequests'],
  s_attendance: ['attendance'],
  s_events:     ['events'],
  s_od:         ['events','odRequests','attendance'],
};

const FETCH_MAP = {
  students: ()=> api('GET','/students'),
  classes:  ()=> api('GET','/classes'),
  subjects: ()=> api('GET','/subjects'),
  grades:   ()=> api('GET','/grades'),
  attendance:()=>api('GET','/attendance'),
  events:   ()=> api('GET','/events'),
  odRequests:()=>api('GET','/od'),
  enrollmentRequests:()=>api('GET','/enrollment'),
};

async function loadFor(tab) {
  const needs = TAB_NEEDS[tab]||[];
  const now = Date.now();
  const stale = 30000; // 30s cache
  const fresh = needs.filter(k => !S.lastFetch[k] || (now-S.lastFetch[k])>stale);
  if (!fresh.length) return;
  const results = await Promise.allSettled(fresh.map(k=>FETCH_MAP[k]&&FETCH_MAP[k]()));
  fresh.forEach((k,i)=>{ if(results[i].status==='fulfilled'&&results[i].value!==undefined){ S.d[k]=results[i].value||[]; S.lastFetch[k]=Date.now(); } });
}

function invalidate(...keys){ keys.forEach(k=>S.lastFetch[k]=0); }

// ─────────────────────────────────────────
// CLOCK
// ─────────────────────────────────────────
setInterval(()=>{ const el=document.getElementById('hdr-clock'); if(el) el.textContent=new Date().toLocaleTimeString(); },1000);

// ─────────────────────────────────────────
// TOAST
// ─────────────────────────────────────────
function toast(msg,type='info',dur=4500){
  const gc={success:'from-emerald-600 to-emerald-800',error:'from-rose-600 to-rose-800',warning:'from-amber-500 to-amber-700',info:'from-slate-700 to-slate-900'};
  const ic={success:'check-circle-2',error:'x-circle',warning:'alert-triangle',info:'info'};
  const t=document.createElement('div');
  t.className=`pointer-events-auto flex items-center gap-3 px-4 py-3.5 rounded-2xl shadow-2xl text-white text-sm font-semibold bg-gradient-to-r ${gc[type]} border border-white/10 min-w-[260px] max-w-xs`;
  t.style.cssText='transform:translateY(20px);opacity:0;transition:all .3s ease';
  t.innerHTML=`<i data-lucide="${ic[type]}" class="w-4 h-4 shrink-0"></i><span>${msg}</span>`;
  document.getElementById('toasts').appendChild(t);
  lucide.createIcons();
  requestAnimationFrame(()=>{t.style.transform='translateY(0)';t.style.opacity='1';});
  setTimeout(()=>{t.style.transform='translateY(20px)';t.style.opacity='0';setTimeout(()=>t.remove(),300);},dur);
}

// ─────────────────────────────────────────
// MODAL
// ─────────────────────────────────────────
function openModal(title,body,footer=''){
  document.getElementById('modal-title').textContent=title;
  document.getElementById('modal-body').innerHTML=body;
  document.getElementById('modal-footer').innerHTML=footer;
  const m=document.getElementById('modal');
  m.classList.remove('hidden');
  m.classList.add('flex');
  lucide.createIcons();
}
function closeModal(){ const m=document.getElementById('modal'); m.classList.add('hidden'); m.classList.remove('flex'); }
function showLoading(t='Processing...',d='Please wait'){ document.getElementById('loading-title').textContent=t; document.getElementById('loading-desc').textContent=d; const el=document.getElementById('loading-overlay'); el.classList.remove('hidden'); el.classList.add('flex'); lucide.createIcons(); }
function hideLoading(){ const el=document.getElementById('loading-overlay'); el.classList.add('hidden'); el.classList.remove('flex'); }
function viewImg(src){ document.getElementById('img-viewer-src').src=src; const el=document.getElementById('img-viewer'); el.classList.remove('hidden'); el.classList.add('flex'); }

// ─────────────────────────────────────────
// AUTH
// ─────────────────────────────────────────
function setLoginTab(t){
  const fac=t==='faculty';
  document.getElementById('form-faculty').classList.toggle('hidden',!fac);
  document.getElementById('form-student').classList.toggle('hidden',fac);
  const tf=document.getElementById('ltab-faculty'), ts=document.getElementById('ltab-student');
  if(fac){ tf.className='flex-1 py-2.5 text-sm font-bold rounded-xl btn-fac'; ts.className='flex-1 py-2.5 text-sm font-bold rounded-xl text-slate-400'; }
  else   { ts.className='flex-1 py-2.5 text-sm font-bold rounded-xl btn-stu'; tf.className='flex-1 py-2.5 text-sm font-bold rounded-xl text-slate-400'; }
}

async function doLogin(){
  const isFac=!document.getElementById('form-faculty').classList.contains('hidden');
  try {
    const payload=isFac
      ?{role:'faculty',adminId:document.getElementById('f-adminId').value.trim(),password:document.getElementById('f-pass').value}
      :{role:'student',email:document.getElementById('s-email').value.trim(),password:document.getElementById('s-pass').value};
    if(!payload.password){toast('Enter your password','warning');return;}
    const data=await api('POST','/auth/login',payload);
    S.token=data.token; S.user=data.user;
    localStorage.setItem('ep_token',data.token);
    localStorage.setItem('ep_user',JSON.stringify(data.user));
    toast(`Welcome, ${data.user.name}!`,'success');
    initApp();
  } catch(e){ toast(e.message||'Login failed','error'); }
}

function doLogout(){
  S.token=null;S.user=null;S.lastFetch={};
  localStorage.removeItem('ep_token');localStorage.removeItem('ep_user');
  document.getElementById('app').classList.add('hidden');
  document.getElementById('login-screen').classList.remove('hidden');
  toast('Logged out','info');
}

// ─────────────────────────────────────────
// NAV
// ─────────────────────────────────────────
const FAC_NAV=[
  {id:'dashboard', label:'Dashboard',  icon:'layout-dashboard'},
  {id:'students',  label:'Students',   icon:'users'},
  {id:'curriculum',label:'Curriculum', icon:'graduation-cap'},
  {id:'gradebook', label:'Gradebook',  icon:'book-open'},
  {id:'evaluation',label:'Evaluation', icon:'clipboard-list'},
  {id:'attendance',label:'Attendance', icon:'calendar-check'},
  {id:'events',    label:'Events',     icon:'calendar-days'},
  {id:'reports',   label:'Reports',    icon:'bar-chart-3'},
];
const STU_NAV=[

  {id:'s_enrollment', label:'Enrollment',    icon:'graduation-cap'},
  {id:'s_attendance', label:'My Attendance', icon:'calendar-check'},
  {id:'s_events',     label:'Events',        icon:'calendar-days'},
  {id:'s_od',         label:'OD / On Duty',  icon:'file-check'},

function renderNav(){
  if(!S.user) return;
  const isFac=S.user.role==='faculty';
  const items=isFac?FAC_NAV:STU_NAV;
  const ac=isFac?'nav-fac':'nav-stu';
  document.getElementById('sidebar').innerHTML=items.map(it=>`
    <button onclick="switchTab('${it.id}')"
      class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-semibold transition-all duration-200

      <i data-lucide="${it.icon}" class="w-4 h-4 shrink-0"></i>${it.label}
    </button>`).join('');

async function switchTab(id){
  S.tab=id; renderNav();
  await loadFor(id);
  renderContent();
}

// ─────────────────────────────────────────
// INIT
// ─────────────────────────────────────────
async function initApp(){
  if(!S.user||!S.token){ document.getElementById('app').classList.add('hidden'); document.getElementById('login-screen').classList.remove('hidden'); return; }
  document.getElementById('login-screen').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  const isFac=S.user.role==='faculty';
  const logo=document.getElementById('hdr-logo'), title=document.getElementById('hdr-title'), sub=document.getElementById('hdr-sub'), av=document.getElementById('hdr-avatar');
  if(isFac){ logo.className='w-10 h-10 rounded-xl btn-fac flex items-center justify-center font-black text-white text-lg glow-orange shrink-0'; title.className='font-black text-base grad-fac'; sub.textContent='Management System'; av.textContent='AD'; S.tab='dashboard'; }
  else { logo.className='w-10 h-10 rounded-xl btn-stu flex items-center justify-center font-black text-white text-lg glow-indigo shrink-0'; title.className='font-black text-base grad-stu'; sub.textContent='Student Portal'; av.textContent=(S.user.name||'ST').substring(0,2).toUpperCase(); S.tab='s_overview'; }
  renderNav();
  await loadFor(S.tab);
  renderContent();
  lucide.createIcons();
}

// ─────────────────────────────────────────
// ROUTER
// ─────────────────────────────────────────
function renderContent(){
  const m=document.getElementById('main');
  let html='';
  switch(S.tab){
    case 'dashboard':    html=renderFacDash(); break;
    case 'students':     html=renderStudents(); break;
    case 'curriculum':   html=renderCurriculum(); break;
    case 'gradebook':    html=renderGradebook(); break;
    case 'evaluation':   html=renderEvaluation(); break;
    case 'attendance':   html=renderAttendance(); break;
    case 'events':       html=renderFacEvents(); break;
    case 'reports':      html=renderReports(); break;
    case 's_overview':   html=renderStuOverview(); break;
    case 's_enrollment': html=renderStuEnrollment(); break;
    case 's_attendance': html=renderStuAttendance(); break;
    case 's_events':     html=renderStuEvents(); break;
    case 's_od':         html=renderStuOD(); break;
  }
  m.innerHTML=`<div class="anim-up">${html}</div>`;
  lucide.createIcons();
}

// ─────────────────────────────────────────
// UI HELPERS
// ─────────────────────────────────────────
const Card=(content,extra='')=>`<div class="glass-card rounded-2xl overflow-hidden shadow-xl card-hover ${extra}">${content}</div>`;
const CardHead=(title,sub='',icon='',grad='from-orange-500 to-pink-600')=>`
  <div class="px-6 py-4 border-b border-white/5 flex items-center gap-4" style="background:rgba(10,15,35,.4)">
    ${icon?`<div class="w-9 h-9 rounded-xl bg-gradient-to-br ${grad} flex items-center justify-center text-white shadow-lg shrink-0"><i data-lucide="${icon}" class="w-4 h-4"></i></div>`:''}
    <div><h3 class="font-black text-white text-sm">${title}</h3>${sub?`<p class="text-[11px] text-slate-500 mt-0.5">${sub}</p>`:''}</div>
  </div>`;

function StatCard(label,value,icon,grad,sub=''){
  return `<div class="glass-card rounded-2xl p-5 stat-card cursor-default" style="--card-grad:linear-gradient(90deg,${grad.replace('from-','').replace('to-','')})">
    <div class="flex items-center justify-between">
      <div><p class="text-[10px] text-slate-500 font-black uppercase tracking-widest mb-2">${label}</p>
        <p class="text-3xl font-black text-white">${value}</p>
        ${sub?`<p class="text-[10px] text-slate-500 mt-1.5">${sub}</p>`:''}
      </div>
      <div class="w-14 h-14 rounded-2xl bg-gradient-to-br ${grad} flex items-center justify-center text-white shadow-xl shrink-0">
        <i data-lucide="${icon}" class="w-6 h-6"></i></div>
    </div>
  </div>`;
}

const Badge=(text,type='gray')=>{
  const c={green:'bg-emerald-500/20 text-emerald-400 border-emerald-500/30',red:'bg-rose-500/20 text-rose-400 border-rose-500/30',amber:'bg-amber-500/20 text-amber-400 border-amber-500/30',blue:'bg-blue-500/20 text-blue-400 border-blue-500/30',indigo:'bg-indigo-500/20 text-indigo-400 border-indigo-500/30',gray:'bg-slate-700/40 text-slate-400 border-slate-600/30',orange:'bg-orange-500/20 text-orange-400 border-orange-500/30',purple:'bg-purple-500/20 text-purple-400 border-purple-500/30',teal:'bg-teal-500/20 text-teal-400 border-teal-500/30'}[type]||'bg-slate-700/40 text-slate-400';
  return `<span class="px-2 py-0.5 rounded-lg text-[10px] font-bold border ${c} uppercase tracking-wide">${text}</span>`;
};

const Empty=(msg='No data yet')=>`<div class="py-16 text-center"><i data-lucide="inbox" class="w-10 h-10 text-slate-700 mx-auto mb-3"></i><p class="text-slate-600 text-sm">${msg}</p></div>`;

function getGrade(pct){
  if(pct===null||pct===undefined||isNaN(pct)) return{grade:'—',label:'No Data',cls:'text-slate-500',bg:'bg-slate-700/20',border:'border-slate-600/30'};
  if(pct>=90) return{grade:'S',label:'Superior', cls:'text-purple-400',bg:'bg-purple-500/15',border:'border-purple-500/30'};
  if(pct>=80) return{grade:'A',label:'Very Good',cls:'text-emerald-400',bg:'bg-emerald-500/15',border:'border-emerald-500/30'};
  if(pct>=70) return{grade:'B',label:'Good',     cls:'text-teal-400',  bg:'bg-teal-500/15',  border:'border-teal-500/30'};
  if(pct>=60) return{grade:'C',label:'Average',  cls:'text-blue-400',  bg:'bg-blue-500/15',  border:'border-blue-500/30'};
  if(pct>=50) return{grade:'D',label:'Pass',     cls:'text-amber-400', bg:'bg-amber-500/15', border:'border-amber-500/30'};
  return{grade:'F',label:'Fail',cls:'text-rose-400',bg:'bg-rose-500/15',border:'border-rose-500/30'};
}

          ${[['Present',present,'#10b981'],['Absent',absent,'#ef4444'],['OD',od,'#f59e0b']].map(([l,v,c])=>`
            <div class="glass-light rounded-2xl py-5"><p class="text-4xl font-black" style="color:${c}">${v}</p><p class="text-xs text-slate-500 mt-1 uppercase font-bold">${l}</p></div>`).join('')}
        </div>`)}

        <div class="p-5 space-y-4">
          ${S.d.classes.map(c=>{const cnt=S.d.students.filter(s=>s.class_id==c.id).length;const pct=S.d.students.length?(cnt/S.d.students.length*100):0;return`<div><div class="flex justify-between items-center mb-1.5"><span class="text-sm font-bold text-slate-200">${c.name}</span><span class="text-xs text-slate-500">${cnt}</span></div><div class="h-2 rounded-full bg-slate-800 overflow-hidden"><div class="h-full rounded-full btn-fac transition-all duration-700" style="width:${pct}%"></div></div></div>`;}).join('')||Empty('No classes')}

function renderGradebook(){
  const blocks=S.d.classes.map(cls=>{
    const students=S.d.students.filter(s=>s.class_id==cls.id);
    const subjects=S.d.subjects.filter(s=>s.class_id==cls.id);
    const rows=students.map(stu=>{
      const sg=S.d.grades.filter(g=>g.student_id==stu.id);
      const nums=sg.map(g=>parseFloat(g.score)).filter(n=>!isNaN(n));
      const avg=nums.length?Math.round(nums.reduce((a,b)=>a+b,0)/nums.length):null;
      const gi=getGrade(avg);
      return `<div class="flex flex-col sm:flex-row sm:items-center gap-3 px-5 py-4 border-b border-white/5 tbl-row transition-colors">
        <div class="flex items-center gap-3 flex-1 min-w-0">
          <div class="w-9 h-9 rounded-xl glass-light flex items-center justify-center font-bold text-slate-300">${(stu.name||'?')[0]}</div>
          <div class="min-w-0">
            <div class="flex items-center gap-2"><p class="font-bold text-white text-sm truncate">${stu.name}</p>
              ${avg!==null?`<span class="text-xs font-black ${gi.cls}">${avg}% ${gi.grade}</span>`:''}</div>
            <div class="flex flex-wrap gap-1 mt-1">${sg.sort((a,b)=>a.week-b.week).map(g=>`<span class="text-[10px] px-2 py-0.5 rounded-lg glass-light text-slate-400 font-bold">W${g.week}: ${g.subject_name?.substring(0,4)||'?'} ${g.score}</span>`).join('')}</div>
          </div>
        </div>
        <div class="flex flex-wrap gap-2">${subjects.map(sub=>`<button onclick="openGradeModal('${stu.id}','${stu.name.replace(/'/g,'')}','${sub.id}','${sub.name.replace(/'/g,'')}')" class="px-3 py-1.5 rounded-lg text-xs font-bold text-slate-300 glass-light border border-white/10 hover:border-orange-500/50 hover:text-orange-400 transition-colors">+ ${sub.name}</button>`).join('')}</div>
      </div>`;
    }).join('')||'<div class="py-8 text-center text-slate-600 text-sm">No students in this class</div>';
    return Card(`${CardHead(cls.name,'Enter weekly grades per student','book-open')}${rows}`,'mb-4');
  }).join('');
  return `<div><div class="flex items-center gap-3 mb-5 glass-card rounded-2xl p-4">
    <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-amber-500 to-orange-600 flex items-center justify-center text-white shadow-lg"><i data-lucide="book-open" class="w-5 h-5"></i></div>
    <div><h2 class="font-black text-white">Gradebook</h2><p class="text-xs text-slate-500">Track weekly performance per subject</p></div>
  </div>${blocks||Empty('Create classes and enroll students first')}</div>`;
}

function renderEvaluation(){
  const SCALE=[{g:'S',r:'90–100%',cls:'text-purple-400',bg:'bg-purple-500/10 border-purple-500/25'},{g:'A',r:'80–89%',cls:'text-emerald-400',bg:'bg-emerald-500/10 border-emerald-500/25'},{g:'B',r:'70–79%',cls:'text-teal-400',bg:'bg-teal-500/10 border-teal-500/25'},{g:'C',r:'60–69%',cls:'text-blue-400',bg:'bg-blue-500/10 border-blue-500/25'},{g:'D',r:'50–59%',cls:'text-amber-400',bg:'bg-amber-500/10 border-amber-500/25'},{g:'F',r:'< 50%',cls:'text-rose-400',bg:'bg-rose-500/10 border-rose-500/25'}];
  const scaleHtml=`<div class="grid grid-cols-3 sm:grid-cols-6 gap-3 mb-6">${SCALE.map(x=>`<div class="rounded-2xl p-4 border text-center stat-card ${x.bg}"><p class="text-4xl font-black ${x.cls}">${x.g}</p><p class="text-[11px] font-bold mt-2 ${x.cls}">${x.r}</p></div>`).join('')}</div>`;
  const blocks=S.d.classes.map(cls=>{
    const students=S.d.students.filter(s=>s.class_id==cls.id);
    const subjects=S.d.subjects.filter(s=>s.class_id==cls.id);
    if(!students.length) return '';
    const header=`<thead style="background:rgba(10,15,35,.6)" class="border-b border-white/5"><tr>
      <th class="py-3 px-4 text-xs font-black text-slate-500 uppercase text-left" style="min-width:140px">Student</th>
      ${subjects.map(s=>`<th class="py-3 px-3 text-xs font-black text-slate-500 uppercase text-center whitespace-nowrap">${s.name}<br><span class="text-[9px] normal-case font-normal text-slate-600">/100</span></th>`).join('')}
      <th class="py-3 px-4 text-xs font-black text-slate-500 uppercase text-center">Total</th>
      <th class="py-3 px-4 text-xs font-black text-purple-400 uppercase text-center">%</th>
      <th class="py-3 px-4 text-xs font-black text-purple-400 uppercase text-center">Grade</th>
      <th class="py-3 px-4 text-xs font-black text-slate-500 uppercase text-center">Status</th>
    </tr></thead>`;
    const bodyRows=students.map(stu=>{
      const sg=S.d.grades.filter(g=>g.student_id==stu.id);
      let tot=0,cnt=0;
      const cells=subjects.map(sub=>{
        const latest=sg.filter(g=>g.subject_id==sub.id).sort((a,b)=>b.week-a.week)[0];
        const num=latest?parseFloat(latest.score):NaN;
        const has=!isNaN(num);
        if(has){tot+=num;cnt++;}
        const cc=!has?'text-slate-600':num>=90?'text-purple-400':num>=75?'text-emerald-400':num>=50?'text-amber-400':'text-rose-400';
        return `<td class="py-3 px-3 text-center text-sm font-bold ${cc}">${latest?latest.score:'—'}</td>`;
      }).join('');
      const pct=cnt>0?Math.round(tot/cnt):null;
      const gi=getGrade(pct);
      return `<tr class="border-b border-white/5 tbl-row transition-colors">
        <td class="py-3 px-4 font-bold text-white text-sm">${stu.name}</td>${cells}
        <td class="py-3 px-4 text-center text-sm font-bold text-slate-300">${cnt>0?Math.round(tot)+'/'+cnt*100:'—'}</td>
        <td class="py-3 px-4 text-center text-sm font-black ${gi.cls}">${pct!==null?pct+'%':'—'}</td>
        <td class="py-3 px-4 text-center"><span class="inline-flex items-center justify-center w-9 h-9 rounded-xl text-lg font-black border ${gi.cls} ${gi.bg} ${gi.border}">${gi.grade}</span></td>
        <td class="py-3 px-4 text-center">${pct!==null?Badge(pct>=50?'Pass':'Fail',pct>=50?'green':'red'):Badge('N/A','gray')}</td>
      </tr>`;
    }).join('');
    const allPcts=students.map(stu=>{const sg2=S.d.grades.filter(g=>g.student_id==stu.id);let t=0,c=0;subjects.forEach(sub=>{const l=sg2.filter(g=>g.subject_id==sub.id).sort((a,b)=>b.week-a.week)[0];const n=l?parseFloat(l.score):NaN;if(!isNaN(n)){t+=n;c++;}});return c>0?Math.round(t/c):null;}).filter(p=>p!==null);
    const classAvg=allPcts.length?Math.round(allPcts.reduce((a,b)=>a+b,0)/allPcts.length):null;
    const cg=getGrade(classAvg);
    return Card(`${CardHead(cls.name,'Subject-wise marks · Percentage · Grade','clipboard-list','from-purple-500 to-indigo-600')}
      <div class="overflow-x-auto"><table class="w-full text-left">${header}<tbody>${bodyRows}</tbody></table></div>
      <div class="px-5 py-3 border-t border-white/5 flex flex-wrap gap-5 items-center text-xs" style="background:rgba(10,15,35,.4)">
        <span class="text-slate-500">Class Avg:</span><span class="font-black ${cg.cls}">${classAvg!==null?classAvg+'% — '+cg.grade:'—'}</span>
        <span class="text-emerald-400 font-bold">✅ Pass: ${allPcts.filter(p=>p>=50).length}</span>
        <span class="text-rose-400 font-bold">❌ Fail: ${allPcts.filter(p=>p<50).length}</span>
      </div>`,'mb-5');
  }).join('');
  return `<div class="flex items-center gap-3 mb-5 glass-card rounded-2xl p-4">
    <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-purple-500 to-indigo-600 flex items-center justify-center text-white shadow-lg shrink-0"><i data-lucide="clipboard-list" class="w-5 h-5"></i></div>
    <div><h2 class="font-black text-white">Student Evaluation System</h2><p class="text-xs text-slate-500">Subject-wise marks · Auto percentage · Letter grade (S / A / B / C / D / F)</p></div>
  </div>${scaleHtml}${blocks||Empty('Create classes, assign subjects and enter marks in Gradebook first')}`;
}

function openGeoCam(odId){
  S.geoCamOdId=odId; S.geoLat=null; S.geoLng=null;
  const modal=document.getElementById('geo-modal');
  modal.classList.remove('hidden'); modal.classList.add('flex');
  document.getElementById('geo-loading').classList.remove('hidden');
  document.getElementById('geo-video').classList.add('hidden');
  document.getElementById('geo-canvas').classList.add('hidden');
  document.getElementById('geo-capture-btn').disabled=true;
  navigator.mediaDevices.getUserMedia({video:{facingMode:'environment',width:{ideal:1280},height:{ideal:720}},audio:false})
    .then(stream=>{
      S.geoStream=stream;
      const vid=document.getElementById('geo-video');
      vid.srcObject=stream;
      vid.onloadedmetadata=()=>{
        vid.play();
        document.getElementById('geo-loading').classList.add('hidden');
        vid.classList.remove('hidden');
        navigator.geolocation.watchPosition(pos=>{
          S.geoLat=pos.coords.latitude; S.geoLng=pos.coords.longitude;
          document.getElementById('geo-coords').textContent=`📍 ${S.geoLat.toFixed(6)}, ${S.geoLng.toFixed(6)}`;
          document.getElementById('geo-status-text').textContent=`GPS acquired: ${S.geoLat.toFixed(5)}, ${S.geoLng.toFixed(5)}`;
          document.getElementById('geo-capture-btn').disabled=false;
        },err=>{ document.getElementById('geo-coords').textContent='⚠️ GPS unavailable'; document.getElementById('geo-capture-btn').disabled=false; },{enableHighAccuracy:true});
      };
    }).catch(err=>{ closeGeoModal(); toast('Camera error: '+err.message,'error'); });
  setInterval(()=>{ const el=document.getElementById('geo-time'); if(el) el.textContent='🕐 '+new Date().toLocaleString(); },1000);
}

async function captureGeoPhoto(){
  const vid=document.getElementById('geo-video');
  const canvas=document.getElementById('geo-canvas');
  const W=vid.videoWidth||640, H=vid.videoHeight||480;
  canvas.width=W; canvas.height=H;
  const ctx=canvas.getContext('2d');
  ctx.drawImage(vid,0,0,W,H);
  ctx.fillStyle='rgba(0,0,0,0.75)';
  ctx.fillRect(0,H-70,W,70);
  ctx.fillStyle='#f97316'; ctx.font=`bold ${Math.round(W*0.018)}px DM Sans,sans-serif`;
  ctx.fillText('EduPortal OD Verification',16,H-50);
  ctx.fillStyle='#ffffff'; ctx.font=`${Math.round(W*0.015)}px monospace`;
  ctx.fillText(S.geoLat?`📍 ${S.geoLat.toFixed(6)}, ${S.geoLng.toFixed(6)}`:'📍 GPS unavailable',16,H-30);
  ctx.fillText('🕐 '+new Date().toLocaleString(),16,H-12);
  const b64=canvas.toDataURL('image/jpeg',0.88);
  if(S.geoStream){S.geoStream.getTracks().forEach(t=>t.stop());S.geoStream=null;}
  vid.classList.add('hidden'); canvas.classList.remove('hidden');
  document.getElementById('geo-capture-btn').textContent='Submitting...';
  document.getElementById('geo-capture-btn').disabled=true;
  try{
    await api('POST',`/od/${S.geoCamOdId}/geo-photo`,{geoB64:b64,lat:S.geoLat,lng:S.geoLng});
    closeGeoModal();
    toast('📍 Geo-photo submitted! Awaiting admin verification.','success',6000);
    invalidate('odRequests');
    await loadFor(S.tab);
    renderContent();
  }catch(e){ closeGeoModal(); toast(e.message||'Submission failed','error'); }
}

function closeGeoModal(){
  if(S.geoStream){S.geoStream.getTracks().forEach(t=>t.stop());S.geoStream=null;}
  const modal=document.getElementById('geo-modal');
  modal.classList.add('hidden'); modal.classList.remove('flex');
}

async function changePass(){ const p1=document.getElementById('np1').value,p2=document.getElementById('np2').value; if(!p1){toast('Enter password','warning');return;} if(p1!==p2){toast('Passwords do not match','error');return;} try{ await api('PUT','/students/me/password',{password:p1}); toast('Password updated','success'); closeModal(); }catch(e){toast(e.message,'error');} }
