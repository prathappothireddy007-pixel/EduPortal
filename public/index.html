<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduPortal Academic & Campus Operations Platform</title>
  <!-- Tailwind CSS & Lucide Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] },
          colors: {
            brand: {
              bg: '#06091a',
              surface: 'rgba(15, 23, 42, 0.75)',
              glass: 'rgba(255, 255, 255, 0.04)',
              border: 'rgba(255, 255, 255, 0.08)',
              blue: '#3B82F6',
              purple: '#8B5CF6',
              emerald: '#10B981',
              amber: '#F59E0B',
              rose: '#EF4444',
            }
          }
        }
      }
    }
  </script>

  <style>
    * { box-sizing: border-box; }
    body { background-color: #06091a; color: #F8FAFC; font-family: 'Inter', sans-serif; margin: 0; overflow-x: hidden; }
    
    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.6); }
    ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(59, 130, 246, 0.5); }

    /* Glassmorphism */
    .glass-panel {
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.07);
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .glass-card:hover {
      background: rgba(255, 255, 255, 0.06);
      border-color: rgba(255, 255, 255, 0.15);
      transform: translateY(-2px);
    }

    .glass-input {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #F8FAFC;
      border-radius: 10px;
      padding: 10px 14px;
      outline: none;
      transition: all 0.2s;
    }
    .glass-input:focus {
      border-color: #3B82F6;
      background: rgba(59, 130, 246, 0.08);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
    }

    /* Buttons */
    .btn-primary {
      background: linear-gradient(135deg, #3B82F6 0%, #6366F1 100%);
      color: #FFFFFF;
      font-weight: 600;
      border-radius: 10px;
      padding: 10px 20px;
      transition: all 0.2s;
      box-shadow: 0 4px 14px rgba(59, 130, 246, 0.3);
    }
    .btn-primary:hover {
      opacity: 0.92;
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(59, 130, 246, 0.4);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.07);
      color: #94A3B8;
      border: 1px solid rgba(255, 255, 255, 0.1);
      font-weight: 500;
      border-radius: 10px;
      padding: 10px 20px;
      transition: all 0.2s;
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.12);
      color: #F8FAFC;
    }

    /* Metric Cards Accent Line */
    .stat-card { position: relative; overflow: hidden; }
    .stat-blue::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, #3B82F6, #6366F1); }
    .stat-emerald::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, #10B981, #059669); }
    .stat-amber::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, #F59E0B, #D97706); }
    .stat-purple::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, #8B5CF6, #7C3AED); }
    .stat-rose::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, #EF4444, #DC2626); }

    /* Animations */
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    .animate-fade-in { animation: fadeIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

    /* Badges */
    .badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 9999px; font-size: 12px; font-weight: 600; }
    .badge-blue { background: rgba(59, 130, 246, 0.15); color: #60A5FA; border: 1px solid rgba(59, 130, 246, 0.3); }
    .badge-emerald { background: rgba(16, 185, 129, 0.15); color: #34D399; border: 1px solid rgba(16, 185, 129, 0.3); }
    .badge-amber { background: rgba(245, 158, 11, 0.15); color: #FCD34D; border: 1px solid rgba(245, 158, 11, 0.3); }
    .badge-rose { background: rgba(239, 68, 68, 0.15); color: #FCA5A5; border: 1px solid rgba(239, 68, 68, 0.3); }
    .badge-purple { background: rgba(139, 92, 246, 0.15); color: #C4B5FD; border: 1px solid rgba(139, 92, 246, 0.3); }

    /* Toast */
    #toast-container { position: fixed; bottom: 24px; right: 24px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; max-width: 380px; }
    .toast-item { background: #0F172A; border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 12px; padding: 14px 18px; font-size: 14px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); display: flex; align-items: center; gap: 12px; animation: fadeIn 0.3s ease; }

    /* Stepper */
    .step-item { display: flex; flex-direction: column; align-items: center; position: relative; z-index: 1; flex: 1; }
    .step-circle { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; }
    .step-circle.active { background: #3B82F6; color: white; box-shadow: 0 0 15px rgba(59,130,246,0.6); }
    .step-circle.done { background: #10B981; color: white; }
    .step-circle.pending { background: rgba(255,255,255,0.08); color: #64748B; border: 1px solid rgba(255,255,255,0.1); }
  </style>
</head>
<body class="min-h-screen flex flex-col antialiased selection:bg-blue-500 selection:text-white">

  <!-- LOGIN / AUTH CONTAINER -->
  <div id="auth-screen" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-[#06091a]">
    <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-blue-900/20 via-[#06091a] to-[#06091a] pointer-events-none"></div>
    <div class="glass-panel w-full max-w-md p-8 rounded-2xl shadow-2xl relative border border-white/10">
      <div class="text-center mb-8">
        <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-tr from-blue-600 to-indigo-600 mb-4 shadow-lg shadow-blue-500/30">
          <i data-lucide="graduation-cap" class="w-9 h-9 text-white"></i>
        </div>
        <h1 class="text-2xl font-extrabold text-white tracking-tight">EduPortal OS</h1>
        <p class="text-sm text-slate-400 mt-1">Smart Academic & Campus Management System</p>
      </div>

      <!-- Role Selector -->
      <div class="grid grid-cols-2 gap-2 p-1 bg-white/5 rounded-xl mb-6 border border-white/10">
        <button id="btn-role-faculty" onclick="setRole('faculty')" class="py-2.5 rounded-lg text-sm font-semibold transition-all bg-blue-600 text-white shadow-md">Faculty Portal</button>
        <button id="btn-role-student" onclick="setRole('student')" class="py-2.5 rounded-lg text-sm font-semibold transition-all text-slate-400 hover:text-white">Student Portal</button>
      </div>

      <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2" id="login-id-label">Admin / Faculty ID</label>
          <input type="text" id="login-id" required class="glass-input w-full" placeholder="e.g. 192411184">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Password</label>
          <input type="password" id="login-password" required class="glass-input w-full" placeholder="••••••••">
        </div>
        <button type="submit" class="btn-primary w-full mt-4 flex items-center justify-center gap-2">
          <span>Sign In to Portal</span>
          <i data-lucide="arrow-right" class="w-4 h-4"></i>
        </button>
      </form>
      <div class="mt-6 text-center text-xs text-slate-500">
        Default Faculty: <span class="text-slate-400 font-mono">192411184 / katam@123</span>
      </div>
    </div>
  </div>

  <!-- MAIN APP WRAPPER (HIDDEN BEFORE LOGIN) -->
  <div id="app-screen" class="hidden flex min-h-screen">
    
    <!-- SIDEBAR -->
    <aside id="sidebar" class="w-64 glass-panel border-r border-white/10 flex flex-col justify-between transition-all duration-300 z-30 shrink-0">
      <div>
        <!-- Brand Header -->
        <div class="h-16 flex items-center justify-between px-6 border-b border-white/10">
          <div class="flex items-center gap-3">
            <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-600 flex items-center justify-center shadow-md">
              <i data-lucide="layers" class="w-5 h-5 text-white"></i>
            </div>
            <span class="font-extrabold text-lg text-white tracking-tight">EduPortal</span>
          </div>
          <button onclick="toggleSidebar()" class="text-slate-400 hover:text-white p-1 rounded-lg hover:bg-white/5">
            <i data-lucide="panel-left-close" class="w-5 h-5"></i>
          </button>
        </div>

        <!-- Navigation Links -->
        <div id="nav-container" class="px-3 py-4 space-y-6 overflow-y-auto max-h-[calc(100vh-8rem)]">
          <!-- Dynamic Nav loaded based on role -->
        </div>
      </div>

      <!-- User Footer -->
      <div class="p-4 border-t border-white/10 flex items-center justify-between glass-panel">
        <div class="flex items-center gap-3 overflow-hidden">
          <div id="user-avatar" class="w-9 h-9 rounded-full bg-blue-600/30 border border-blue-500/40 flex items-center justify-center font-bold text-blue-400 shrink-0">
            F
          </div>
          <div class="truncate">
            <p id="user-display-name" class="text-sm font-semibold text-white truncate">Administrator</p>
            <p id="user-display-role" class="text-xs text-slate-400 capitalize">Faculty</p>
          </div>
        </div>
        <button onclick="handleLogout()" title="Logout" class="text-slate-400 hover:text-rose-400 p-2 rounded-lg hover:bg-white/5 transition-colors">
          <i data-lucide="log-out" class="w-5 h-5"></i>
        </button>
      </div>
    </aside>

    <!-- CONTENT WRAPPER -->
    <div class="flex-1 flex flex-col min-w-0 bg-[#06091a]">
      
      <!-- TOP HEADER BAR -->
      <header class="h-16 glass-panel border-b border-white/10 flex items-center justify-between px-8 sticky top-0 z-20">
        <div class="flex items-center gap-4">
          <h2 id="page-title" class="text-xl font-bold text-white tracking-tight">Dashboard Overview</h2>
        </div>

        <div class="flex items-center gap-4">
          <!-- Notifications Bell Button -->
          <div class="relative">
            <button onclick="toggleNotificationPanel()" class="relative p-2 rounded-xl text-slate-400 hover:text-white hover:bg-white/5 transition-all">
              <i data-lucide="bell" class="w-5 h-5"></i>
              <span id="unread-count-badge" class="hidden absolute top-1.5 right-1.5 w-2.5 h-2.5 bg-rose-500 rounded-full ring-4 ring-[#06091a]"></span>
            </button>

            <!-- Notifications Dropdown Panel -->
            <div id="notification-dropdown" class="hidden absolute right-0 mt-3 w-80 sm:w-96 glass-panel rounded-2xl shadow-2xl border border-white/15 p-4 z-50 animate-fade-in">
              <div class="flex items-center justify-between pb-3 border-b border-white/10 mb-3">
                <h4 class="font-bold text-sm text-white">Notifications</h4>
                <button onclick="markAllNotificationsRead()" class="text-xs text-blue-400 hover:text-blue-300 font-medium">Mark all as read</button>
              </div>
              <div id="notification-list-container" class="space-y-2 max-h-80 overflow-y-auto pr-1 text-sm text-slate-300">
                <p class="text-xs text-slate-500 text-center py-4">No notifications yet.</p>
              </div>
            </div>
          </div>

          <div class="h-6 w-[1px] bg-white/10"></div>
          <span id="current-date" class="text-xs font-semibold text-slate-400 bg-white/5 px-3 py-1.5 rounded-lg border border-white/10"></span>
        </div>
      </header>

      <!-- MAIN DYNAMIC CONTENT CONTAINER -->
      <main id="main-content" class="flex-1 p-8 overflow-y-auto">
        <!-- Rendered dynamically -->
      </main>

    </div>
  </div>

  <!-- TOAST CONTAINER -->
  <div id="toast-container"></div>

  <!-- MODAL CONTAINER -->
  <div id="modal-wrapper" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70 backdrop-blur-sm animate-fade-in">
    <div class="glass-panel w-full max-w-lg rounded-2xl border border-white/15 shadow-2xl overflow-hidden">
      <div class="flex items-center justify-between px-6 py-4 border-b border-white/10">
        <h3 id="modal-title" class="font-bold text-lg text-white">Modal Header</h3>
        <button onclick="closeModal()" class="text-slate-400 hover:text-white p-1 rounded-lg hover:bg-white/5">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>
      <div id="modal-body" class="p-6 max-h-[75vh] overflow-y-auto space-y-4">
        <!-- Content -->
      </div>
      <div id="modal-footer" class="flex items-center justify-end gap-3 px-6 py-4 border-t border-white/10 bg-white/[0.02]">
        <!-- Action Buttons -->
      </div>
    </div>
  </div>

  <!-- JAVASCRIPT APPLICATION CORE -->
  <script>
    // App State Object
    const S = {
      role: 'faculty',
      token: localStorage.getItem('edu_token') || null,
      user: JSON.parse(localStorage.getItem('edu_user') || 'null'),
      tab: 'dashboard',
      cache: {},
      sidebarCollapsed: false,
      notifications: []
    };

    // --- UTILITIES & API HTTP WRAPPER ---
    async function api(method, path, body = null) {
      const headers = { 'Content-Type': 'application/json' };
      if (S.token) headers['Authorization'] = `Bearer ${S.token}`;
      
      const opts = { method, headers };
      if (body) opts.body = JSON.stringify(body);

      try {
        const res = await fetch(`/api${path}`, opts);
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Server error occurred');
        return data;
      } catch (err) {
        toast(err.message, 'error');
        throw err;
      }
    }

    function toast(msg, type = 'info') {
      const container = document.getElementById('toast-container');
      const item = document.createElement('div');
      item.className = 'toast-item';
      
      let icon = 'info';
      let iconColor = 'text-blue-400';
      if (type === 'success') { icon = 'check-circle'; iconColor = 'text-emerald-400'; }
      if (type === 'error') { icon = 'alert-circle'; iconColor = 'text-rose-400'; }
      if (type === 'warning') { icon = 'alert-triangle'; iconColor = 'text-amber-400'; }

      item.innerHTML = `
        <i data-lucide="${icon}" class="w-5 h-5 ${iconColor} shrink-0"></i>
        <span class="text-sm font-medium text-slate-200">${msg}</span>
      `;
      container.appendChild(item);
      lucide.createIcons();

      setTimeout(() => {
        item.style.opacity = '0';
        item.style.transform = 'translateY(10px)';
        item.style.transition = 'all 0.3s';
        setTimeout(() => item.remove(), 300);
      }, 4000);
    }

    function setRole(role) {
      S.role = role;
      const bFac = document.getElementById('btn-role-faculty');
      const bStu = document.getElementById('btn-role-student');
      const lbl = document.getElementById('login-id-label');
      const inp = document.getElementById('login-id');

      if (role === 'faculty') {
        bFac.className = 'py-2.5 rounded-lg text-sm font-semibold transition-all bg-blue-600 text-white shadow-md';
        bStu.className = 'py-2.5 rounded-lg text-sm font-semibold transition-all text-slate-400 hover:text-white';
        lbl.innerText = 'Admin / Faculty ID';
        inp.placeholder = 'e.g. 192411184';
      } else {
        bStu.className = 'py-2.5 rounded-lg text-sm font-semibold transition-all bg-blue-600 text-white shadow-md';
        bFac.className = 'py-2.5 rounded-lg text-sm font-semibold transition-all text-slate-400 hover:text-white';
        lbl.innerText = 'Student Register / Roll ID';
        inp.placeholder = 'e.g. 2024STU101';
      }
    }

    async function handleLogin(e) {
      e.preventDefault();
      const adminId = document.getElementById('login-id').value.trim();
      const password = document.getElementById('login-password').value.trim();

      try {
        const data = await api('POST', '/auth/login', { adminId, password, role: S.role });
        S.token = data.token;
        S.user = data.user;
        localStorage.setItem('edu_token', data.token);
        localStorage.setItem('edu_user', JSON.stringify(data.user));

        toast('Welcome back, ' + S.user.name, 'success');
        initApp();
      } catch (err) {
        // Error already toasted by api wrapper
      }
    }

    function handleLogout() {
      S.token = null;
      S.user = null;
      localStorage.removeItem('edu_token');
      localStorage.removeItem('edu_user');
      document.getElementById('app-screen').classList.add('hidden');
      document.getElementById('auth-screen').classList.remove('hidden');
      toast('Signed out successfully', 'info');
    }

    // --- NAVIGATION DEFINITION ---
    const FACULTY_NAV = [
      { section: 'DASHBOARD', items: [{ tab: 'dashboard', label: 'Dashboard', icon: 'home' }] },
      { section: 'ACADEMICS', items: [
        { tab: 'students', label: 'Students Directory', icon: 'users' },
        { tab: 'faculty-users', label: 'Faculty Management', icon: 'shield-check' },
        { tab: 'classes', label: 'Classes', icon: 'layout-grid' },
        { tab: 'subjects', label: 'Subjects', icon: 'book' },
        { tab: 'gradebook', label: 'Gradebook', icon: 'award' },
        { tab: 'evaluation', label: 'Evaluation & Reports', icon: 'bar-chart-2' }
      ]},
      { section: 'ATTENDANCE & OD', items: [
        { tab: 'attendance', label: 'Attendance Entry', icon: 'calendar-check' },
        { tab: 'od-requests', label: 'OD Requests', icon: 'clipboard-check' }
      ]},
      { section: 'CAMPUS OPERATIONS', items: [
        { tab: 'classrooms', label: 'Classroom Overview', icon: 'building-2' },
        { tab: 'timetable', label: 'Timetable Allocations', icon: 'clock' },
        { tab: 'events', label: 'Events & Registration', icon: 'star' }
      ]},
      { section: 'INSIGHTS & SUPPORT', items: [
        { tab: 'academic-risk', label: 'Academic Risk Engine', icon: 'alert-triangle' },
        { tab: 'issues', label: 'Issue Tracking', icon: 'message-square' },
        { tab: 'documents', label: 'Digital Vault', icon: 'file-text' },
        { tab: 'achievements', label: 'Achievements', icon: 'trophy' },
        { tab: 'certificates', label: 'Certificate Generator', icon: 'medal' },
        { tab: 'audit-logs', label: 'System Audit Logs', icon: 'activity' },
        { tab: 'settings', label: 'Global Settings', icon: 'settings' }
      ]}
    ];

    const STUDENT_NAV = [
      { section: 'MY ACADEMICS', items: [
        { tab: 'dashboard', label: 'Overview', icon: 'home' },
        { tab: 'grades', label: 'My Grades & Performance', icon: 'award' },
        { tab: 'what-if', label: 'What-If Simulator', icon: 'zap' },
        { tab: 'attendance-calc', label: 'Attendance Shortage', icon: 'calculator' }
      ]},
      { section: 'MY CAMPUS', items: [
        { tab: 'where-is-my-class', label: 'Where Is My Class?', icon: 'map-pin' },
        { tab: 'timetable', label: 'Class Schedule', icon: 'clock' },
        { tab: 'events', label: 'Campus Events', icon: 'star' },
        { tab: 'od-status', label: 'My OD Workflow', icon: 'clipboard-list' }
      ]},
      { section: 'SUPPORT & VAULT', items: [
        { tab: 'certificates', label: 'My Certificates', icon: 'medal' },
        { tab: 'achievements', label: 'My Portfolio', icon: 'trophy' },
        { tab: 'documents', label: 'Digital Vault', icon: 'file-text' },
        { tab: 'issues', label: 'Student Support', icon: 'help-circle' }
      ]}
    ];

    function renderNav() {
      const navContainer = document.getElementById('nav-container');
      const navStructure = S.user.role === 'faculty' ? FACULTY_NAV : STUDENT_NAV;
      
      let html = '';
      navStructure.forEach(sec => {
        html += `<div class="text-[10px] font-extrabold text-slate-500 tracking-wider uppercase px-3 mb-2">${sec.section}</div>`;
        sec.items.forEach(item => {
          const active = S.tab === item.tab;
          html += `
            <button onclick="switchTab('${item.tab}')" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition-all ${
              active 
                ? 'bg-blue-600/15 text-blue-400 border border-blue-500/30 shadow-sm font-semibold' 
                : 'text-slate-400 hover:text-white hover:bg-white/5'
            }">
              <i data-lucide="${item.icon}" class="w-4 h-4 ${active ? 'text-blue-400' : 'text-slate-400'}"></i>
              <span class="truncate">${item.label}</span>
            </button>
          `;
        });
        html += '<div class="h-2"></div>';
      });

      navContainer.innerHTML = html;
      lucide.createIcons();
    }

    function switchTab(tab) {
      S.tab = tab;
      renderNav();
      renderPage();
    }

    function initApp() {
      if (!S.user || !S.token) return;
      document.getElementById('auth-screen').classList.add('hidden');
      document.getElementById('app-screen').classList.remove('hidden');

      document.getElementById('user-display-name').innerText = S.user.name;
      document.getElementById('user-display-role').innerText = S.user.role;
      document.getElementById('user-avatar').innerText = S.user.name.charAt(0).toUpperCase();

      document.getElementById('current-date').innerText = new Date().toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });

      renderNav();
      renderPage();
      fetchNotifications();
    }

    async function fetchNotifications() {
      try {
        const notifs = await api('GET', '/notifications');
        S.notifications = notifs;
        const unread = notifs.filter(n => !n.is_read).length;
        const badge = document.getElementById('unread-count-badge');
        if (unread > 0) badge.classList.remove('hidden');
        else badge.classList.add('hidden');

        const list = document.getElementById('notification-list-container');
        if (notifs.length === 0) {
          list.innerHTML = `<p class="text-xs text-slate-500 text-center py-4">No notifications yet.</p>`;
          return;

        list.innerHTML = notifs.map(n => `
          <div class="p-3 rounded-xl ${n.is_read ? 'bg-white/[0.02]' : 'bg-blue-500/10 border border-blue-500/20'} text-xs">
            <div class="flex items-center justify-between font-semibold text-white mb-1">
              <span>${n.title}</span>
              <span class="text-[10px] text-slate-500">${new Date(n.created_at).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</span>

            <p class="text-slate-400 line-clamp-2">${n.message}</p>

    }

                  </div>
                  <div class="step-item">

                  </div>

                ${o.status === 'approved' ? `

    function openSubmitODModal() {
      openModal('Submit OD Request', `
        <div class="space-y-4">
          <div><label class="block text-xs font-semibold text-slate-400 mb-1">Event Name</label><input type="text" id="m-od-event" class="glass-input w-full" placeholder="e.g. Hackathon 2026"></div>
          <div><label class="block text-xs font-semibold text-slate-400 mb-1">Upload Letter Photo (Base64)</label><input type="file" id="m-od-file" accept="image/*" class="glass-input w-full"></div>
        </div>
      `, `<button onclick="saveOD()" class="btn-primary w-full">Submit OD Request</button>`);
    }

    async function saveOD() {
      const eventName = document.getElementById('m-od-event').value;
      const fileInput = document.getElementById('m-od-file');
      if (!fileInput.files[0]) return toast('Photo required', 'warning');

      const reader = new FileReader();
      reader.onload = async (e) => {
        try {
          await api('POST', '/od', { eventName, letterB64: e.target.result });
          toast('OD Request Submitted', 'success');
          closeModal();
          renderPage();
        } catch(err) {}
      };
      reader.readAsDataURL(fileInput.files[0]);
    }

    async function triggerGeoCamera(odId) {
      if (!navigator.geolocation) return toast('Geolocation is not supported by your browser', 'error');
      
      navigator.geolocation.getCurrentPosition(async (pos) => {
        const lat = pos.coords.latitude;
        const lng = pos.coords.longitude;

        try {
          await api('POST', `/od/${odId}/geo-photo`, {
            geoB64: 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==',
            lat, lng
          });
          toast('Geo photo verified & submitted!', 'success');
          renderPage();
        } catch(e) {}
      }, (err) => toast('GPS position required for OD verification', 'error'));
    }

    // --- MODAL UTILITIES ---
    function openModal(title, bodyHtml, footerHtml = '') {
      document.getElementById('modal-title').innerText = title;
      document.getElementById('modal-body').innerHTML = bodyHtml;
      document.getElementById('modal-footer').innerHTML = footerHtml || `<button onclick="closeModal()" class="btn-secondary">Close</button>`;
      document.getElementById('modal-wrapper').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('modal-wrapper').classList.add('hidden');
    }

    function toggleSidebar() {
      const sb = document.getElementById('sidebar');
      sb.classList.toggle('w-64');
      sb.classList.toggle('w-20');
    }

    // Auto-init on load if token present
    window.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      if (S.token && S.user) initApp();
    });
